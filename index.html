                  ))}
                  {/* Standalone items */}
                  {standalone.map(item => renderItem(item, false))}
                </div>
              );
            })()}
          </div>
        );
      })}
      {/* Add family button */}

    </div>
  );
}

// ─── STATS & CHARTS ──────────────────────────────────────────────────────────
function LineChart({ data, color, unit }) {
  if (!data || data.length < 2) return (
    <div style={{ height:120, display:'flex', alignItems:'center', justifyContent:'center', color:'#555', fontSize:12 }}>Pas encore assez de données</div>
  );

  const vals = data.map(d => d.value);
  const maxV = Math.max(...vals, 1);
  const minV = 0;
  const W = 300, H = 100, PAD = 8;
  const xStep = (W - PAD*2) / (data.length - 1);
  const yScale = v => H - PAD - (v - minV) / (maxV - minV) * (H - PAD*2);

  const points = data.map((d, i) => ({ x: PAD + i * xStep, y: yScale(d.value) }));
  const polyline = points.map(p => `${p.x},${p.y}`).join(' ');
  const area = `${points[0].x},${H} ` + points.map(p => `${p.x},${p.y}`).join(' ') + ` ${points[points.length-1].x},${H}`;

  return (
    <div style={{ overflowX:'auto' }}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width:'100%', height:120 }}>
        {/* Grid lines */}
        {[0.25, 0.5, 0.75, 1].map((f, i) => (
          <line key={i} x1={PAD} y1={yScale(maxV*f)} x2={W-PAD} y2={yScale(maxV*f)}
            stroke="rgba(255,255,255,0.05)" strokeWidth="1" />
        ))}
        {/* Y labels */}
        {[0, Math.round(maxV/2), maxV].map((v, i) => (
          <text key={i} x={PAD} y={yScale(v)-2} fill="#555" fontSize="7" textAnchor="start">{v}{unit}</text>
        ))}
        {/* Area fill */}
        <polygon points={area} fill={color} opacity="0.08" />
        {/* Line */}
        <polyline points={polyline} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round" />
        {/* Points */}
        {points.map((p, i) => (
          <g key={i}>
            <circle cx={p.x} cy={p.y} r="3" fill={color} />
            {data[i].isCurrent && <circle cx={p.x} cy={p.y} r="5" fill="none" stroke={color} strokeWidth="1.5" />}
          </g>
        ))}
        {/* X labels */}
        {data.map((d, i) => (
          i % Math.ceil(data.length / 6) === 0 || i === data.length - 1 ? (
            <text key={i} x={PAD + i * xStep} y={H-1} fill={d.isCurrent ? '#c9a84c' : '#555'} fontSize="7" textAnchor="middle">{d.label}</text>
          ) : null
        ))}
      </svg>
    </div>
  );
}

function StatsCharts({ sessions, settings }) {
  const [view, setView] = useState('week');

  const weekStartDay = settings?.weekStartDay ?? 4;

  // Helper: get minutes worked for a session (including alternatif)
  const sessionMin = s => {
    if (s.type === 'alternatif') return s.timeSpent || 0;
    if (s.validated) return s.actualMin || 0;
    if (s.blocks) return s.blocks.filter(b=>b.validated).reduce((a,b)=>a+(b.actualMin||0),0);
    return 0;
  };

  // Safe date helper — skip sessions with invalid dates
  const validSessions = sessions.filter(s => s.date && !isNaN(new Date(s.date+'T12:00:00').getTime()));
  const safeWeekKey = s => { try { return getWeekKey(s.date, weekStartDay); } catch(_) { return ''; } };
  const isWorked = s => (s.type==='alternatif' && (s.timeSpent||0)>0) || s.validated || (s.blocks && s.blocks.some(b=>b.validated));

  // Current week stats
  const thisWeekKey = getWeekKey(new Date(), weekStartDay);
  const thisWeekSessions = validSessions.filter(s => safeWeekKey(s) === thisWeekKey && isWorked(s));
  const thisWeekMin = thisWeekSessions.reduce((a,s) => a + sessionMin(s), 0);
  const thisWeekDays = new Set(thisWeekSessions.map(s=>s.date)).size;

  // Weekly chart data — last 12 weeks
  const weekData = Array.from({length:12}, (_, i) => {
    const d = new Date(); d.setDate(d.getDate() - (11-i)*7);
    const wk = getWeekKey(d, weekStartDay);
    const wkStart = new Date(wk+'T12:00:00');
    const mins = validSessions
      .filter(s => safeWeekKey(s) === wk && isWorked(s))
      .reduce((a,s) => a + sessionMin(s), 0);
    const label = `${wkStart.getDate()}/${wkStart.getMonth()+1}`;
    return { label, value: mins, isCurrent: wk === thisWeekKey };
  });

  // Monthly chart data — last 12 months
  const monthData = Array.from({length:12}, (_, i) => {
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - (11-i));
    const yr = d.getFullYear(), mo = d.getMonth();
    const mins = validSessions
      .filter(s => { const sd = new Date(s.date+'T12:00:00'); return sd.getFullYear()===yr && sd.getMonth()===mo && isWorked(s); })
      .reduce((a,s) => a+sessionMin(s), 0);
    const MONTHS = ['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];
    const now = new Date();
    return { label: MONTHS[mo], value: mins, isCurrent: yr===now.getFullYear()&&mo===now.getMonth() };
  });

  // Yearly chart data
  const currentYear = new Date().getFullYear();
  const years = [...new Set(validSessions.map(s => new Date(s.date+'T12:00:00').getFullYear()))].filter(y=>!isNaN(y)).sort();
  if (!years.includes(currentYear)) years.push(currentYear);
  const yearData = years.map(yr => {
    const mins = validSessions
      .filter(s => new Date(s.date+'T12:00:00').getFullYear()===yr && isWorked(s))
      .reduce((a,s)=>a+sessionMin(s),0);
    return { label: String(yr), value: mins, isCurrent: yr===currentYear };
  });

  const formatMin = m => m >= 60 ? `${Math.floor(m/60)}h${m%60?m%60+'':''}` : `${m}'`;

  const chartData = view==='week' ? weekData : view==='month' ? monthData : yearData;
  const chartTitle = view==='week' ? '12 dernières semaines' : view==='month' ? '12 derniers mois' : 'Par année';

  return (
    <div style={{ marginTop:24 }}>
      {/* Current week summary */}
      <div style={{ background:'rgba(201,168,76,0.06)', border:'1px solid rgba(201,168,76,0.15)', borderRadius:14, padding:'16px', marginBottom:20 }}>
        <div style={{ fontSize:12, color:'#888', letterSpacing:2, textTransform:'uppercase', marginBottom:12 }}>Cette semaine</div>
        <div style={{ display:'flex', gap:16 }}>
          <div style={{ flex:1, textAlign:'center' }}>
            <div style={{ fontSize:28, fontWeight:700, color:'#c9a84c', fontFamily:'monospace' }}>{formatMin(thisWeekMin)}</div>
            <div style={{ fontSize:11, color:'#555', marginTop:2 }}>travaillé</div>
          </div>
          <div style={{ width:1, background:'rgba(255,255,255,0.06)' }} />
          <div style={{ flex:1, textAlign:'center' }}>
            <div style={{ fontSize:28, fontWeight:700, color:'#c9a84c', fontFamily:'monospace' }}>{thisWeekDays}</div>
            <div style={{ fontSize:11, color:'#555', marginTop:2 }}>jour{thisWeekDays!==1?'s':''}</div>
          </div>
        </div>
      </div>

      {/* Chart selector */}
      <div style={{ display:'flex', gap:8, marginBottom:16 }}>
        {[['week','Semaine'],['month','Mois'],['year','Année']].map(([k,l]) => (
          <button key={k} onClick={()=>setView(k)} style={{ flex:1, padding:'8px', borderRadius:10, border:'1px solid', fontSize:12, fontWeight:600, cursor:'pointer',
            background: view===k?'rgba(201,168,76,0.15)':'rgba(255,255,255,0.04)',
            borderColor: view===k?'rgba(201,168,76,0.4)':'rgba(255,255,255,0.1)',
            color: view===k?'#c9a84c':'#555' }}>{l}</button>
        ))}
      </div>

      {/* Chart */}
      <div style={{ background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.07)', borderRadius:14, padding:'16px 12px' }}>
        <div style={{ fontSize:12, color:'#888', letterSpacing:1, textTransform:'uppercase', marginBottom:12 }}>
          {chartTitle}
          <span style={{ float:'right', color:'#c9a84c', fontFamily:'monospace', fontWeight:700 }}>
            {formatMin(chartData.reduce((a,d)=>a+d.value,0))} total
          </span>
        </div>
        <LineChart data={chartData} color="#c9a84c" unit="'" />
      </div>
    </div>
  );
}

// ─── CALENDAR VIEW ────────────────────────────────────────────────────────────
function CalendarView({ sessions, setSessions, settings }) {
  const now = new Date();
  const [vm, setVm] = useState(`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`);
  const [absent, setAbsent] = useState(null);
  const [selected, setSelected] = useState(null);
  const [year, month] = vm.split('-').map(Number);
  const firstDay = new Date(year,month-1,1).getDay();
  const daysInMonth = new Date(year,month,0).getDate();
  const offset = (firstDay+6)%7;
  const days = [...Array(offset).fill(null), ...Array.from({length:daysInMonth},(_,i)=>i+1)];

  const getS = d => d ? sessions.find(s=>s.date===`${vm}-${String(d).padStart(2,'0')}`) : null;
  const prev = () => { const d=new Date(year,month-2,1); setVm(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`); };
  const next = () => { const d=new Date(year,month,1); setVm(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`); };

  const [dayModal, setDayModal] = useState(null); // {d, dateStr, existing}


  const openModal = (d) => {
    const dateStr = `${vm}-${String(d).padStart(2,'0')}`;
    const existing = sessions.find(s => s.date === dateStr);
    setDayModal({ d, dateStr, existing });
    setAltDays(1);
  };

  const clearDay = (dateStr) => {
    setSessions(p => p.filter(s => s.date !== dateStr));
    setDayModal(null);
    setSelected(null);
  };

  const markOff = (dateStr) => {
    setSessions(p => [...p.filter(s => s.date !== dateStr), { date: dateStr, type: 'off', weekKey: getWeekKey(dateStr, settings?.weekStartDay ?? 4) }]);
    setDayModal(null);
  };

  const markAlternatif = (dateStr) => {
    const weekStartDay = settings?.weekStartDay ?? 4;
    setSessions(p => [
      ...p.filter(s => s.date !== dateStr),
      { date: dateStr, type: 'alternatif', timeSpent: 0, note: '', weekKey: getWeekKey(dateStr, weekStartDay) }
    ]);
    setDayModal(null);
  };

  const totalWorked = sessions.filter(s=>s.validated||(s.type==='alternatif'&&(s.timeSpent||0)>0)).length;
  const totalMin = sessions.reduce((a,s) => {
    if (s.type==='alternatif') return a+(s.timeSpent||0);
    if (s.validated) return a+(s.actualMin||0);
    if (s.blocks) return a+s.blocks.filter(b=>b.validated).reduce((x,b)=>x+(b.actualMin||0),0);
    return a;
  }, 0);

  return (
    <div>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:20 }}>
        <button onClick={prev} style={{ background:'transparent', border:'1px solid rgba(255,255,255,0.12)', borderRadius:10, padding:'8px 16px', color:'#888', cursor:'pointer', fontSize:18 }}>‹</button>
        <div style={{ fontSize:18, color:'#f0e6d0', fontFamily:"'Playfair Display', serif", textTransform:'capitalize' }}>
          {new Date(year,month-1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}
        </div>
        <button onClick={next} style={{ background:'transparent', border:'1px solid rgba(255,255,255,0.12)', borderRadius:10, padding:'8px 16px', color:'#888', cursor:'pointer', fontSize:18 }}>›</button>
      </div>

      <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:4, marginBottom:20 }}>
        {['L','M','M','J','V','S','D'].map((d,i)=><div key={i} style={{ textAlign:'center', fontSize:11, color:'#555', fontWeight:700, padding:'4px 0' }}>{d}</div>)}
        {days.map((d,i) => {
          if (!d) return <div key={i}/>;
          const dateStr=`${vm}-${String(d).padStart(2,'0')}`;
          const s=getS(d); const isToday=dateStr===TODAY; const isPast=dateStr<TODAY;
          let bg='rgba(255,255,255,0.03)', bc='rgba(255,255,255,0.07)', color='#666';
          const partiallyDone = s && !s.validated && s.blocks && s.blocks.some(b => b.validated);
          if (s?.validated) { bg='rgba(92,186,125,0.15)'; bc='rgba(92,186,125,0.3)'; color='#5cba7d'; }
          else if (partiallyDone) { bg='rgba(92,186,125,0.12)'; bc='rgba(92,186,125,0.35)'; color='#5cba7d'; }
          else if (s?.joker)           { bg='rgba(201,168,76,0.08)'; bc='rgba(201,168,76,0.2)';  color='#c9a84c'; }
          else if (s?.type==='off')     { bg='rgba(224,92,92,0.1)';   bc='rgba(224,92,92,0.25)';  color='#e05c5c'; }
          else if (s?.type==='alternatif') { bg='rgba(123,156,223,0.1)'; bc='rgba(123,156,223,0.25)'; color='#7b9cdf'; }
          else if (s?.absent)          { bg='rgba(224,92,92,0.1)';   bc='rgba(224,92,92,0.2)';   color='#e05c5c'; }
          else if (isToday)            { bg='rgba(201,168,76,0.1)';  bc='rgba(201,168,76,0.4)';  color='#c9a84c'; }
          return (
            <div key={i} onClick={() => {
                if (s && (s.validated || partiallyDone)) {
                  // Validated or partial sessions → detail panel
                  setSelected(null); setTimeout(()=>setSelected(d), 0);
                } else if (s && s.type==='alternatif') {
                  // Alternatif days → detail panel (shows period)
                  setSelected(null); setTimeout(()=>setSelected(d), 0);
                } else {
                  // Off, joker, empty → action modal (can edit/delete)
                  setSelected(null); openModal(d);
                }
              }}
              style={{ borderRadius:10, padding:'6px 4px', textAlign:'center', background:bg, border:`1px solid ${bc}`, cursor: (s&&(s.validated||partiallyDone||s.type==='alternatif'||s.type==='off'||s.joker)) || (!s&&(isPast||isToday)) ? 'pointer' : 'default', minHeight:46, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:2 }}>
              <span style={{ fontSize:13, fontWeight:isToday?700:400, color }}>{d}</span>
              {s?.validated && <span style={{ fontSize:9, color:'#5cba7d', fontFamily:'monospace' }}>{s.actualMin}'</span>}
              {partiallyDone && (
                <>
                  <span style={{ fontSize:9, color:'#5cba7d', fontFamily:'monospace', lineHeight:1 }}>{s.blocks.filter(b=>b.validated).length}/{s.blocks.length}</span>
                  <span style={{ fontSize:9, color:'#5cba7d', fontFamily:'monospace', lineHeight:1 }}>{s.blocks.filter(b=>b.validated).reduce((a,b)=>a+(b.actualMin||0),0)}'</span>
                </>
              )}
              {s?.joker              && <span style={{ fontSize:11 }}>🃏</span>}
              {s?.type==='off'       && <span style={{ fontSize:11 }}>🚫</span>}
              {s?.type==='alternatif'&& <span style={{ fontSize:11 }}>🎒</span>}
              {s?.absent && !s?.type && <span style={{ fontSize:9, color:'#e05c5c' }}>abs</span>}
            </div>
          );
        })}
      </div>

      {selected && (() => {
        const dateStr=`${vm}-${String(selected).padStart(2,'0')}`;
        const s=sessions.find(ss=>ss.date===dateStr);
        const dl=new Date(dateStr+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
        return (
          <div style={{ background:'rgba(255,255,255,0.04)', border:'1px solid rgba(255,255,255,0.1)', borderRadius:14, padding:18, marginBottom:16 }}>
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14 }}>
              <div>
                <div style={{ fontSize:11, color:'#888', letterSpacing:1, textTransform:'uppercase', marginBottom:2 }}>Séance du</div>
                <div style={{ fontSize:15, color:'#f0e6d0', fontFamily:"'Playfair Display', serif", textTransform:'capitalize' }}>{dl}</div>
              </div>
              <button onClick={() => setSelected(null)} style={{ background:'transparent', border:'1px solid rgba(255,255,255,0.12)', borderRadius:8, padding:'6px 12px', color:'#888', cursor:'pointer', fontSize:18 }}>×</button>
            </div>
            {(s?.absent||s?.type==='off') && <div style={{ display:'flex', alignItems:'center', gap:10, color:'#e05c5c' }}><span style={{fontSize:24}}>🚫</span><div><div style={{fontWeight:700}}>Off total</div><div style={{fontSize:12,color:'#888',marginTop:2}}>Aucun travail musical possible</div></div></div>}
            {s?.joker   && <div style={{ display:'flex', alignItems:'center', gap:10, color:'#c9a84c' }}><span style={{fontSize:24}}>🃏</span><div><div style={{fontWeight:700}}>Jour joker</div><div style={{fontSize:12,color:'#888',marginTop:2}}>Session annulée</div></div></div>}
            {s?.type==='alternatif' && (() => {
              const periodDates = getAlternatifPeriod(sessions, dateStr);
              const dailyMin = 10; // fallback
              const budget = periodDates.length * dailyMin;
              const periodSessions = sessions.filter(ss => periodDates.includes(ss.date));
              const totalSpent = periodSessions.reduce((a,ss) => a+(ss.timeSpent||0), 0);
              const pct = Math.min(1, totalSpent / budget);
              const today = new Date().toISOString().slice(0,10);

              return (
                <div>
                  {/* Header */}
                  <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:14 }}>
                    <span style={{fontSize:24}}>🎒</span>
                    <div style={{flex:1}}>
                      <div style={{color:'#7b9cdf', fontWeight:700, fontSize:15}}>Travail alternatif</div>
                      <div style={{fontSize:12, color:'#888', marginTop:2}}>
                        {periodDates.length} jour{periodDates.length>1?'s':''} · du {new Date(periodDates[0]+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'})} au {new Date(periodDates[periodDates.length-1]+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}
                      </div>
                    </div>
                  </div>

                  {/* Progress bar */}
                  <div style={{ marginBottom:16 }}>
                    <div style={{ display:'flex', justifyContent:'space-between', marginBottom:6 }}>
                      <span style={{fontSize:12, color:'#888'}}>Budget période</span>
                      <span style={{fontSize:12, fontFamily:'monospace', fontWeight:700, color: pct>=1?'#5cba7d':'#c9a84c'}}>{totalSpent}/{budget} min</span>
                    </div>
                    <div style={{ height:6, background:'rgba(255,255,255,0.07)', borderRadius:3, overflow:'hidden' }}>
                      <div style={{ height:'100%', width:(pct*100)+'%', background: pct>=1?'#5cba7d':'#7b9cdf', borderRadius:3, transition:'width 0.4s' }} />
                    </div>
                    {pct >= 1 && <div style={{fontSize:11, color:'#5cba7d', marginTop:4}}>🎉 Budget atteint !</div>}
                  </div>

                  {/* Day by day */}
                  {periodDates.map(ds => {
                    const dayS = sessions.find(ss => ss.date === ds);
                    const spent = dayS?.timeSpent || 0;
                    const note = dayS?.note || '';
                    const isFuture = ds > today;
                    const isToday2 = ds === today;
                    const dl = new Date(ds+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
                    return (
                      <div key={ds} style={{ display:'flex', alignItems:'flex-start', gap:10, padding:'9px 12px', background: ds===dateStr?'rgba(123,156,223,0.08)':'rgba(255,255,255,0.02)', borderLeft:'3px solid '+(spent>0?'#7b9cdf':isFuture?'rgba(255,255,255,0.05)':'rgba(255,255,255,0.1)'), borderRadius:8, marginBottom:5, opacity: isFuture?0.45:1 }}>
                        <span style={{fontSize:14, marginTop:1}}>{spent>0?'✅':isFuture?'…':'○'}</span>
                        <div style={{flex:1, minWidth:0}}>
                          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                            <span style={{fontSize:12, color: isToday2?'#c9a84c':spent>0?'#f0e6d0':'#666', fontWeight: isToday2?700:400, textTransform:'capitalize'}}>{dl}{isToday2 ? " (aujourd'hui)" : ""}</span>
                            {spent > 0 && <span style={{fontSize:12, color:'#7b9cdf', fontFamily:'monospace', fontWeight:700}}>{spent} min</span>}
                            {!spent && !isFuture && <span style={{fontSize:11, color:'#555'}}>—</span>}
                          </div>
                          {note && <div style={{fontSize:11, color:'#c8bfa8', marginTop:3, fontStyle:'italic', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{note}</div>}
                        </div>
                      </div>
                    );
                  })}
                </div>
              );
            })()}
            {s && (s.validated || (s.blocks && s.blocks.some(b=>b.validated))) && s.blocks && (
              <>
                <div style={{ display:'flex', gap:10, marginBottom:14 }}>
                  <div style={{ background:'rgba(92,186,125,0.1)', border:'1px solid rgba(92,186,125,0.2)', borderRadius:10, padding:'8px 14px', flex:1, textAlign:'center' }}>
                    <div style={{ fontSize:20, fontWeight:700, color:'#5cba7d', fontFamily:'monospace' }}>{s.actualMin}'</div>
                    <div style={{ fontSize:10, color:'#555', letterSpacing:1 }}>TEMPS RÉEL</div>
                  </div>
                  <div style={{ background:'rgba(201,168,76,0.1)', border:'1px solid rgba(201,168,76,0.2)', borderRadius:10, padding:'8px 14px', flex:1, textAlign:'center' }}>
                    <div style={{ fontSize:20, fontWeight:700, color:'#c9a84c', fontFamily:'monospace' }}>{s.blocks.length}</div>
                    <div style={{ fontSize:10, color:'#555', letterSpacing:1 }}>BLOCS</div>
                  </div>
                </div>
                {s.blocks.map((block,i) => {
                  const cat = CATEGORIES[block.category] || CATEGORIES.gammes;
                  const m = block.validatedMastery && MASTERY[block.validatedMastery];
                  const done = !!block.validated;
                  const timeMatch = done && block.actualMin === block.plannedMin;
                  const timeDiff = done ? block.actualMin - block.plannedMin : null;
                  return (
                    <div key={i} style={{ display:'flex', alignItems:'center', gap:10, padding:'10px 12px', background: done ? 'rgba(255,255,255,0.03)' : 'rgba(255,255,255,0.01)', borderLeft:'3px solid '+(done ? cat.color : 'rgba(255,255,255,0.1)'), borderRadius:8, marginBottom:6, opacity: done ? 1 : 0.5 }}>
                      <span style={{fontSize:18}}>{done ? cat.icon : '○'}</span>
                      <div style={{flex:1}}>
                        <div style={{fontSize:11, color: done ? cat.color : '#555', fontWeight:700, letterSpacing:1, textTransform:'uppercase', marginBottom:1}}>
                          {cat.label}
                          {block.isCatchup && <span style={{color:'#7b9cdf', fontSize:10, marginLeft:6}}>🔄 rattrapage</span>}
                        </div>
                        <div style={{fontSize:13, color: done ? '#f0e6d0' : '#666'}}>{block.title}</div>
                        {done && m && <div style={{fontSize:11, color:m.color, marginTop:2}}>{m.label}</div>}
                        {!done && <div style={{fontSize:11, color:'#555', marginTop:2}}>Non réalisé</div>}
                      </div>
                      <div style={{textAlign:'right'}}>
                        {done ? (
                          <>
                            <div style={{fontSize:13, color: timeMatch?'#5cba7d':timeDiff>0?'#e0a83a':'#7b9cdf', fontFamily:'monospace', fontWeight:700}}>{block.actualMin}'</div>
                            {!timeMatch && <div style={{fontSize:10, color:'#555', marginTop:1}}>prévu {block.plannedMin}'</div>}
                          </>
                        ) : (
                          <div style={{fontSize:13, color:'#555', fontFamily:'monospace'}}>{block.plannedMin}'</div>
                        )}
                      </div>
                    </div>
                  );
                })}

                {/* Summary: planned vs actual */}
                {(() => {
                  const doneBlocks = s.blocks.filter(b => b.validated);
                  const totalPlanned = s.blocks.reduce((a,b) => a+b.plannedMin, 0);
                  const totalActual = doneBlocks.reduce((a,b) => a+(b.actualMin||0), 0);
                  const notDone = s.blocks.length - doneBlocks.length;
                  return (
                    <div style={{ marginTop:10, padding:'10px 12px', background:'rgba(255,255,255,0.03)', borderRadius:8, display:'flex', gap:12, flexWrap:'wrap' }}>
                      <div style={{textAlign:'center', flex:1}}>
                        <div style={{fontSize:16, fontWeight:700, color:'#c9a84c', fontFamily:'monospace'}}>{totalActual}'</div>
                        <div style={{fontSize:10, color:'#555'}}>réel</div>
                      </div>
                      <div style={{textAlign:'center', flex:1}}>
                        <div style={{fontSize:16, fontWeight:700, color:'#888', fontFamily:'monospace'}}>{totalPlanned}'</div>
                        <div style={{fontSize:10, color:'#555'}}>prévu</div>
                      </div>
                      <div style={{textAlign:'center', flex:1}}>
                        <div style={{fontSize:16, fontWeight:700, color: notDone===0?'#5cba7d':'#e0a83a', fontFamily:'monospace'}}>{doneBlocks.length}/{s.blocks.length}</div>
                        <div style={{fontSize:10, color:'#555'}}>blocs</div>
                      </div>
                    </div>
                  );
                })()}
              </>
            )}
          </div>
        );
      })()}

      {/* Day action modal */}
      {dayModal && (
        <div style={{ background:'rgba(255,255,255,0.04)', border:'1px solid rgba(255,255,255,0.12)', borderRadius:16, padding:20, marginBottom:16 }}>
          <div style={{ fontSize:15, color:'#f0e6d0', fontFamily:"'Playfair Display', serif", marginBottom:16, textTransform:'capitalize' }}>
            {new Date(dayModal.dateStr+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
          </div>

          {/* Current status if any */}
          {dayModal.existing && (
            <div style={{ marginBottom:14 }}>
              <div style={{ fontSize:12, color:'#888', marginBottom:8 }}>Marqué actuellement :</div>
              <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'10px 14px', background:'rgba(255,255,255,0.04)', borderRadius:10 }}>
                <span style={{ fontSize:13, color:'#f0e6d0' }}>
                  {dayModal.existing.type==='off' ? '🚫 Off total' : dayModal.existing.type==='alternatif' ? '🎒 Travail alternatif' : dayModal.existing.joker ? '🃏 Joker' : '—'}
                </span>
                <button onClick={() => clearDay(dayModal.dateStr)}
                  style={{ padding:'6px 14px', background:'rgba(224,92,92,0.15)', border:'1px solid rgba(224,92,92,0.3)', borderRadius:8, color:'#e05c5c', fontSize:12, fontWeight:700, cursor:'pointer' }}>
                  🗑 Supprimer
                </button>
              </div>
            </div>
          )}

          <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
            {/* Off total */}
            <button onClick={() => markOff(dayModal.dateStr)} style={{ padding:'14px 16px', background:'rgba(224,92,92,0.1)', border:'1px solid rgba(224,92,92,0.25)', borderRadius:12, color:'#e05c5c', fontWeight:600, fontSize:14, cursor:'pointer', textAlign:'left', display:'flex', alignItems:'center', gap:12 }}>
              <span style={{fontSize:22}}>🚫</span>
              <div>
                <div style={{fontWeight:700}}>Off total</div>
                <div style={{fontSize:11,opacity:0.7,marginTop:2}}>Impossible de travailler la musique</div>
              </div>
            </button>

            {/* Alternatif */}

// Champ numérique avec boutons − / + et saisie directe (remplace les curseurs, trop sensibles au scroll)
function NumberStepper({ label, value, onChange, min, max, step = 1, unit = 'min', color = '#f0e6d0', hint }) {
  const [text, setText] = useState(String(value));
  const [focus, setFocus] = useState(false);
  useEffect(() => { if (!focus) setText(String(value)); }, [value, focus]);
  const clamp = n => Math.min(max, Math.max(min, n));
  const commit = () => {
    const n = parseInt(text, 10);
    const v = isNaN(n) ? value : clamp(n);
    setText(String(v)); if (v !== value) onChange(v);
  };
  const bump = dir => {
    // on aligne sur le pas : 62 + → 65, 62 − → 60
    const r = dir > 0 ? Math.floor(value / step) * step + step : Math.ceil(value / step) * step - step;
    onChange(clamp(r));
  };
  const btn = (dir, disabled) => (
    <button type="button" disabled={disabled} onClick={() => bump(dir)} aria-label={dir > 0 ? 'Augmenter' : 'Diminuer'}
      style={{ width:44, height:44, borderRadius:12, border:'1px solid rgba(201,168,76,0.35)', background: disabled ? 'rgba(255,255,255,0.03)' : 'rgba(201,168,76,0.12)',
        color: disabled ? '#444' : '#c9a84c', fontSize:22, fontWeight:600, lineHeight:1, cursor: disabled ? 'default' : 'pointer', flexShrink:0, touchAction:'manipulation' }}>
      {dir > 0 ? '+' : '−'}
    </button>
  );
  return (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:12, marginBottom:14, padding:'10px 12px', background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.07)', borderRadius:14 }}>
      <div style={{ flex:1, minWidth:0 }}>
        <div style={{ fontSize:13, color, lineHeight:1.3 }}>{label}</div>
        {hint && <div style={{ fontSize:10, color:'#555', marginTop:2 }}>{hint}</div>}
        <div style={{ fontSize:10, color:'#555', marginTop:2 }}>{min}–{max} {unit}</div>
      </div>
      <div style={{ display:'flex', alignItems:'center', gap:6 }}>
        {btn(-1, value <= min)}
        <div style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:4, width:84, height:44, boxSizing:'border-box', borderRadius:12, background:'rgba(0,0,0,0.25)', border:'1px solid ' + (focus ? '#c9a84c' : 'rgba(255,255,255,0.1)'), padding:'0 6px' }}>
          <input type="text" inputMode="numeric" pattern="[0-9]*" value={text}
            onFocus={e => { setFocus(true); e.target.select(); }}
            onBlur={() => { setFocus(false); commit(); }}
            onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }}
            onChange={e => setText(e.target.value.replace(/[^0-9]/g, '').slice(0, 3))}
            style={{ width: Math.max(1, text.length) + 'ch', height:20, margin:0, background:'transparent', border:'none', outline:'none', color:'#c9a84c', fontFamily:'monospace', fontWeight:700, fontSize:16, lineHeight:'20px', textAlign:'center', padding:0, boxSizing:'content-box' }} />
          <span style={{ fontSize:11, lineHeight:'20px', height:20, color:'#777', display:'flex', alignItems:'center' }}>{unit === 'jours' ? 'j' : unit.startsWith('min') ? 'min' : unit}</span>
        </div>
        {btn(1, value >= max)}
      </div>
    </div>
  );
}

// Répare les dates "Vu"/maîtrise des éléments à partir des blocs validés dans les séances
function reconcileItems(items, sessions) {
  const best = {}; // itemId -> {date, mastery, revDate}
  (sessions || []).forEach(se => {
    if (!se || !se.date || !Array.isArray(se.blocks)) return;
    se.blocks.forEach(b => {
      if (!b || !b.validated || b.itemId == null) return;
      const cur = best[b.itemId] || (best[b.itemId] = { date: null, mastery: null, rev: null });
      if (!cur.date || se.date >= cur.date) { cur.date = se.date; cur.mastery = b.validatedMastery || cur.mastery; }
      if (b.category === 'revision' && (!cur.rev || se.date > cur.rev)) cur.rev = se.date;
    });
  });
  let fixed = 0;
  const next = (items || []).map(it => {
    const b = best[it.id]; if (!b) return it;
    let out = it;
    if (b.date && (!it.lastWorked || it.lastWorked < b.date)) {
      out = { ...out, lastWorked: b.date };
      if (b.mastery) out.mastery = b.mastery;
      fixed++;
    }
    if (b.rev && (!it.lastRevised || it.lastRevised < b.rev)) out = { ...out, lastRevised: b.rev };
    return out;
  });
  return { items: next, fixed };
}

  const [tab, setTab] = useState('today');
  const [saveStatus, setSaveStatus] = useState(null);
  const [saveError, setSaveError] = useState(false);

  const [needReauth, setNeedReauth] = useState(false);
  const [repairNote, setRepairNote] = useState(null);
  const reconciledRef = useRef(false);
  useEffect(() => {
    if (reconciledRef.current || !il || !sl || loadFailed) return;
    reconciledRef.current = true;
    const r = reconcileItems(items, sessions);
    if (r.fixed > 0) { setItems(r.items); setRepairNote(r.fixed); }
  }, [il, sl, loadFailed]);

  useEffect(() => {
    DriveDB.onSaveSuccess = () => {
      setSaveStatus('saved');
      setSaveError(false);
      setNeedReauth(false);
      setTimeout(() => setSaveStatus(null), 2000);
    };
    DriveDB.onSaveError = () => {
      setSaveStatus('error');
      setSaveError(true);
    };
    DriveDB.onTokenExpiredCallback = () => {
      setNeedReauth(true);
      setSaveError(true);
    };
    return () => {
      DriveDB.onSaveSuccess = null;
      DriveDB.onSaveError = null;
      DriveDB.onTokenExpiredCallback = null;
    };
  }, []);

  const downloadBlob = (blob, filename) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  };

  // Export : .json (sans photo) ou .zip (données + photos)
  const exportData = async (progress) => {
    if (loadFailed) return { ok: false, msg: "Lecture de tes données impossible : export bloqué (il contiendrait des données d'exemple). Recharge l'appli." };
    const r = await buildBackup({ items, sessions, settings }, progress);
    downloadBlob(r.blob, r.filename);
    try { localStorage.setItem('cadence_last_export', localISO(new Date())); } catch(_) {}
    const warn = r.missing ? '\n⚠️ ' + r.missing + ' photo(s) introuvable(s) (hors connexion ?) : sauvegarde incomplète, réessaie avec du réseau.' : '';
    return { ok: !r.missing, exported: true, msg: '✅ Fichier téléchargé (' + r.photos + ' photo' + (r.photos > 1 ? 's' : '') + ').' + warn };
  };

  // Import : remplace toutes les données par celles d'une sauvegarde (une copie de sécurité reste sur Drive)
  const importData = async (file, progress) => {
    if (loadFailed) return { ok: false, msg: "Lecture de tes données impossible : import bloqué. Recharge l'appli." };
    const { data, zip, photoNames } = await parseBackup(file);
    const when = data.exportedAt ? new Date(data.exportedAt).toLocaleDateString('fr-FR') : 'date inconnue';
    const ok = window.confirm('Remplacer TOUTES tes données actuelles par la sauvegarde du ' + when + ' ?\n\n' +
      data.items.length + ' éléments, ' + data.sessions.length + ' sessions, ' + photoNames.length + ' photo(s).\n\n' +
      'Tes données actuelles seront écrasées (une copie de sécurité est gardée sur Drive).');
    if (!ok) return { ok: false, msg: 'Import annulé.' };
    progress('Copie de sécurité…');
    await DriveDB.set('pm_backup_before_import.json', { savedAt: new Date().toISOString(), items, sessions, settings });
    let uploaded = 0;
    if (zip && photoNames.length) uploaded = await restorePhotos(zip, photoNames, progress);
    progress('Enregistrement des données…');
    const newSettings = { ...DEFAULT_SETTINGS, ...data.settings };
    const newSessions = data.sessions.filter(s => s && s.date && !isNaN(new Date(s.date + 'T12:00:00').getTime()));
    await DriveDB.set('pm_items.json', data.items);
    await DriveDB.set('pm_sessions.json', newSessions);
    await DriveDB.set('pm_settings.json', newSettings);
    setItems(data.items); setSessions(newSessions); setSettings(newSettings);
    return { ok: true, msg: '✅ Import terminé : ' + data.items.length + ' éléments, ' + newSessions.length + ' sessions, ' + photoNames.length + ' photo(s) (' + uploaded + ' envoyée(s) sur Drive).' };
  };

  // Nettoyage : supprime de Drive les photos qu'aucun exercice n'utilise (et créées il y a plus de 24 h)
  const cleanupPhotos = async () => {
    if (loadFailed) return { ok: false, msg: "Lecture de tes données impossible : nettoyage bloqué. Recharge l'appli." };
    const used = new Set(collectPhotoIds(items));
    try { // les photos de la copie de sécurité d'avant import restent protégées
      const bk = await DriveDB.get('pm_backup_before_import.json');
      if (bk && Array.isArray(bk.items)) collectPhotoIds(bk.items).forEach(id => used.add(id));
    } catch (_) {}
    const files = await DriveDB.listFiles(PHOTO_PREFIX);
    const limit = Date.now() - 24 * 3600 * 1000;
    const idOf = f => f.name.slice(PHOTO_PREFIX.length).replace(/\.jpg$/i, '');
    const orphans = files.filter(f => !used.has(idOf(f)) && new Date(f.createdTime).getTime() < limit);
    if (!orphans.length) return { ok: true, msg: 'Aucune photo inutilisée à supprimer.' };
    const mb = (orphans.reduce((a, f) => a + Number(f.size || 0), 0) / 1048576).toFixed(1);
    if (!window.confirm(orphans.length + ' photo(s) inutilisée(s) (' + mb + ' Mo) seront supprimées de Drive. Continuer ?')) return { ok: false, msg: 'Nettoyage annulé.' };
    for (const f of orphans) { await DriveDB.deleteFile(f.name); ImgCache.del(idOf(f)); }
    return { ok: true, msg: '✅ ' + orphans.length + ' photo(s) supprimée(s) (' + mb + ' Mo libérés).' };
  };

  const forceSave = async () => {
    if (loadFailed) { alert("Lecture de tes données Drive impossible : sauvegarde bloquée pour protéger tes fichiers. Recharge l'appli."); return; }
    setSaveStatus('saving');
    try {
      await Promise.all([
        DriveDB.set('pm_items.json', items),
        DriveDB.set('pm_sessions.json', sessions),
        DriveDB.set('pm_settings.json', settings),
      ]);
      setSaveStatus('saved');
      setSaveError(false);
      setTimeout(() => setSaveStatus(null), 2000);
    } catch(e) {
      setSaveStatus('error');
      setSaveError(true);
    }
  };

  // Schedule notification on load
  useEffect(() => {
    if (il && stl && settings.reminderEnabled && 'serviceWorker' in navigator) {
      navigator.serviceWorker.ready.then(sw => {
        sw.active && sw.active.postMessage({ type: 'SCHEDULE_NOTIF', enabled: true, hour: settings.reminderHour, minute: settings.reminderMinute });
      });
    }
  }, [il, stl]);

  if (!il || !sl || !stl) return (
    <div style={{ minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center' }}>
      <div style={{ textAlign:'center' }}>
        <div style={{ fontSize:36, marginBottom:12 }}>♩</div>
        <div style={{ color:'#c9a84c', fontFamily:'monospace', letterSpacing:2 }}>Chargement…</div>
      </div>
    </div>
  );

  const TABS = [{id:'today',label:"Aujourd'hui",icon:'🎯'},{id:'library',label:'Bibliothèque',icon:'📚'},{id:'calendar',label:'Calendrier',icon:'📅'},{id:'settings',label:'Réglages',icon:'⚙️'}];
  const weekSessions = sessions.filter(s=>s.validated&&s.date&&sameWeek(s.date, localISO(new Date()), settings.weekStartDay??4)).length;
  const weekJoker = sessions.some(s=>s.joker&&s.date&&sameWeek(s.date, localISO(new Date()), settings.weekStartDay??4));

  return (
    <div style={{ minHeight:'100vh', minHeight:'100dvh', background:'#1a1a18', display:'flex', flexDirection:'column' }}>
      {/* Header */}
      <div style={{ padding:'20px 16px 0', borderBottom:'1px solid rgba(255,255,255,0.06)', background:'#1a1a18', position:'sticky', top:0, zIndex:100 }}>
        <div style={{ display:'flex', alignItems:'flex-end', justifyContent:'space-between', marginBottom:16 }}>
          <div>
            <div style={{ fontSize:20, fontFamily:"'Playfair Display', serif", color:'#f0e6d0', lineHeight:1 }}>
              <em>Cadence</em> <span style={{ color:'#c9a84c' }}>♩</span>
            </div>
            <div style={{ display:'flex', alignItems:'center', gap:6, marginTop:2 }}>
              <div style={{ fontSize:10, color:'#555', letterSpacing:2, textTransform:'uppercase' }}>Journal de pratique</div>
              {saveStatus === 'saving' && <div style={{ width:6, height:6, borderRadius:'50%', background:'#e0a83a' }} title="Sauvegarde..." />}
              {saveStatus === 'saved'  && <div style={{ width:6, height:6, borderRadius:'50%', background:'#5cba7d' }} title="Sauvegardé ✓" />}
              {saveStatus === 'error'  && <div style={{ width:6, height:6, borderRadius:'50%', background:'#e05c5c' }} title="Erreur de sauvegarde !" />}
            </div>
          </div>
          <div style={{ textAlign:'right' }}>
            <div style={{ fontSize:10, color:'#555' }}>Cette semaine</div>
            <div style={{ fontSize:15, color:'#c9a84c', fontFamily:'monospace', fontWeight:700 }}>
              {weekSessions}<span style={{ fontSize:10, color:'#555', marginLeft:3 }}>sessions</span>
              {weekJoker && <span style={{ fontSize:13, marginLeft:5 }}>🃏</span>}
            </div>
          </div>
        </div>
        <div style={{ display:'flex' }}>
          {TABS.map(t => (
            <button key={t.id} onClick={() => setTab(t.id)} style={{ flex:1, padding:'8px 2px', background:'transparent', border:'none', borderBottom:tab===t.id?'2px solid #c9a84c':'2px solid transparent', color:tab===t.id?'#c9a84c':'#555', cursor:'pointer', fontSize:10, fontWeight:600, letterSpacing:0.5 }}>
              <div style={{ fontSize:18, marginBottom:2 }}>{t.icon}</div>
              {t.label}
            </button>
          ))}
        </div>
      </div>

      {repairNote && (
        <div style={{ background:'rgba(100,180,120,0.15)', borderBottom:'1px solid rgba(100,180,120,0.4)', padding:'8px 16px', display:'flex', alignItems:'center', gap:10, fontSize:12, color:'#8ccf9c' }}>
          <span style={{flex:1}}>🔧 {repairNote} date(s) « Vu » corrigée(s) d'après tes séances validées.</span>
          <button onClick={() => setRepairNote(null)} style={{ background:'none', border:'none', color:'#8ccf9c', fontSize:16, cursor:'pointer' }}>×</button>
        </div>
      )}

      {/* Load failed banner: Drive writes are blocked to protect real data */}
      {loadFailed && (
        <div style={{ background:'rgba(224,92,92,0.15)', borderBottom:'1px solid rgba(224,92,92,0.4)', padding:'10px 16px', display:'flex', alignItems:'center', gap:10 }}>
          <span style={{fontSize:18}}>🛑</span>
          <div style={{flex:1}}>
            <div style={{fontSize:13, color:'#e05c5c', fontWeight:700}}>Lecture de tes données impossible</div>
            <div style={{fontSize:11, color:'#888', marginTop:1}}>Ce que tu vois n'est pas ton vrai contenu. Rien n'est enregistré : tes fichiers Drive sont protégés. Recharge l'appli.</div>
          </div>
          <button onClick={() => window.location.reload()} style={{ padding:'6px 12px', background:'rgba(224,92,92,0.2)', border:'1px solid rgba(224,92,92,0.4)', borderRadius:8, color:'#e05c5c', fontSize:12, fontWeight:700, cursor:'pointer', whiteSpace:'nowrap' }}>
            Recharger
          </button>
        </div>
      )}

      {/* Save error banner */}
      {saveError && (
        <div style={{ background:'rgba(224,92,92,0.12)', borderBottom:'1px solid rgba(224,92,92,0.3)', padding:'10px 16px', display:'flex', alignItems:'center', gap:10 }}>
          <span style={{fontSize:18}}>⚠️</span>
          <div style={{flex:1}}>
            <div style={{fontSize:13, color:'#e05c5c', fontWeight:700}}>
              {needReauth ? 'Session expirée' : 'Sauvegarde échouée'}
            </div>
            <div style={{fontSize:11, color:'#888', marginTop:1}}>
              {needReauth ? 'Reconnecte-toi pour continuer à sauvegarder' : 'Tes données ne sont pas enregistrées sur Drive'}
            </div>
          </div>
          {needReauth ? (
            <button onClick={() => {
              sessionStorage.removeItem('cadence_token');
              sessionStorage.removeItem('cadence_expiry');
              window.location.reload();
            }} style={{ padding:'6px 12px', background:'rgba(224,92,92,0.2)', border:'1px solid rgba(224,92,92,0.4)', borderRadius:8, color:'#e05c5c', fontSize:12, fontWeight:700, cursor:'pointer', whiteSpace:'nowrap' }}>
              🔑 Reconnecter
            </button>
          ) : (
            <button onClick={forceSave} style={{ padding:'6px 12px', background:'rgba(224,92,92,0.2)', border:'1px solid rgba(224,92,92,0.4)', borderRadius:8, color:'#e05c5c', fontSize:12, fontWeight:700, cursor:'pointer', whiteSpace:'nowrap' }}>
              Réessayer
            </button>
          )}
        </div>
      )}

      {/* Content */}
      <div style={{ flex:1, padding:'20px 16px 80px', overflowY:'auto' }}>
        {tab==='today'    && <TodayView    items={items} settings={settings} sessions={sessions} setSessions={setSessions} setItems={setItems} />}
        {tab==='library'  && <LibraryView  items={items} setItems={setItems} settings={settings} />}
        {tab==='calendar' && <CalendarView sessions={sessions} setSessions={setSessions} settings={settings} />}
        {tab==='settings' && <SettingsView settings={settings} setSettings={setSettings} forceSave={forceSave} saveStatus={saveStatus} onExport={exportData} onImport={importData} onCleanup={cleanupPhotos} />}
      </div>
    </div>
  );
}

// ─── AUTH SCREEN ──────────────────────────────────────────────────────────────
function AuthScreen({ onAuth }) {
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);

  useEffect(() => {
    const t   = sessionStorage.getItem('cadence_token');
    const exp = sessionStorage.getItem('cadence_expiry');
    if (t && exp && Date.now() < parseInt(exp) - 60000) {
      DriveDB.setToken(t);
      onAuth();
    }
  }, []);

  const signIn = () => {
    setLoading(true); setError(null);
    try {
      const client = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPE,
        callback: resp => {
          if (resp.error) { setError('Connexion échouée. Réessaie.'); setLoading(false); return; }
          DriveDB.setToken(resp.access_token);
          sessionStorage.setItem('cadence_token', resp.access_token);
          sessionStorage.setItem('cadence_expiry', String(Date.now() + resp.expires_in * 1000));
          DriveDB.flushPendingSaves().catch(console.error);
          onAuth();
        }
      });
      client.requestAccessToken({ prompt: '' });
    } catch(e) { setError('Google non disponible.'); setLoading(false); }
  };

  // Auto-refresh token 5 min before expiry — silent, no popup
  useEffect(() => {
    const check = setInterval(() => {
      const expiry = parseInt(sessionStorage.getItem('cadence_expiry') || '0');
      if (!expiry || Date.now() < expiry - 5 * 60 * 1000) return;
      try {
        const client = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID, scope: SCOPE,
          callback: resp => {
            if (resp.error || !resp.access_token) return;
            DriveDB.setToken(resp.access_token);
            sessionStorage.setItem('cadence_token', resp.access_token);
            sessionStorage.setItem('cadence_expiry', String(Date.now() + resp.expires_in * 1000));
            DriveDB.flushPendingSaves().catch(console.error);
          }
        });
        client.requestAccessToken({ prompt: 'none' });
      } catch(_) {}
    }, 60000);
    return () => clearInterval(check);
  }, []);

  return (
    <div style={{ minHeight:'100vh', minHeight:'100dvh', display:'flex', alignItems:'center', justifyContent:'center', padding:24 }}>
      <div style={{ textAlign:'center', maxWidth:300, width:'100%' }}>
        <div style={{ fontSize:72, marginBottom:12, lineHeight:1 }}>♩</div>
        <div style={{ fontSize:34, fontFamily:"'Playfair Display', serif", color:'#f0e6d0', marginBottom:6 }}><em>Cadence</em></div>
        <div style={{ fontSize:12, color:'#555', letterSpacing:2, textTransform:'uppercase', marginBottom:52 }}>Journal de pratique musicale</div>
        <button onClick={signIn} disabled={loading} style={{ width:'100%', padding:'16px 24px', background:loading?'rgba(255,255,255,0.04)':'#c9a84c', border:'none', borderRadius:16, color:loading?'#555':'#1a1a18', fontWeight:700, fontSize:16, cursor:loading?'default':'pointer', display:'flex', alignItems:'center', justifyContent:'center', gap:10 }}>
          <span>🔑</span>{loading?'Connexion…':'Se connecter avec Google'}
        </button>
        {error && <div style={{ marginTop:14, color:'#e05c5c', fontSize:13 }}>{error}</div>}
        <div style={{ marginTop:20, fontSize:11, color:'#666', lineHeight:1.6 }}>
          ⚠️ La connexion Google expire après 1h.<br/>Si tes données ne se sauvegardent plus, reconnecte-toi.
        </div>
        <div style={{ marginTop:32, fontSize:11, color:'#444', lineHeight:1.7 }}>
          Tes données sont stockées dans ton Google Drive personnel.<br/>Personne d'autre n'y a accès.
        </div>
      </div>
    </div>
  );
}

// ─── ROOT ─────────────────────────────────────────────────────────────────────
function AppWrapper() {
  const [authed, setAuthed] = useState(false);
  return authed ? <App /> : <AuthScreen onAuth={() => setAuthed(true)} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<AppWrapper />);

// ─── SERVICE WORKER ───────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/cadence/sw.js', { scope: '/cadence/' })
      .then(reg => console.log('SW registered', reg.scope))
      .catch(err => console.log('SW error', err));
  });
}
</script>
