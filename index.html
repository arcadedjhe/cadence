// ─── DRIVE STORAGE ────────────────────────────────────────────────────────────
const DriveDB = {
  token: null, fileIds: {}, cache: {},
  setToken(t) { this.token = t; },

  onTokenExpiredCallback: null,

  async req(url, opts = {}) {
    const res = await fetch(url, {
      ...opts,
      headers: { 'Authorization': `Bearer ${this.token}`, ...(opts.headers || {}) }
    });
    if (res.status === 401) {
      if (this.onTokenExpiredCallback) this.onTokenExpiredCallback();
      throw new Error('TOKEN_EXPIRED');
    }
    return res;
  },

  async getFileId(name) {
    if (this.fileIds[name]) return this.fileIds[name];
    const r = await this.req(
      `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D'${name}'&fields=files(id)`
    );
    if (!r.ok) throw new Error('LIST_FAILED_' + r.status);
    const d = await r.json();
    if (d.files && d.files[0]) { this.fileIds[name] = d.files[0].id; return d.files[0].id; }
    return null;
  },

  async get(name) {
    if (this.cache[name] !== undefined) return this.cache[name];
    const id = await this.getFileId(name);
    if (!id) { this.cache[name] = null; return null; }
    const r = await this.req(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);
    if (!r.ok) throw new Error('READ_FAILED_' + r.status);
    const data = await r.json();
    this.cache[name] = data;
    return data;
  },

  onTokenExpired: null, // callback to trigger re-auth

  // Écritures sérialisées par fichier : une seule requête à la fois, et si plusieurs
  // sauvegardes s'enchaînent vite, seule la plus récente est envoyée (dernier état gagnant).
  _chain: {}, _latest: {},
  set(name, data) {
    this.cache[name] = data;
    this._latest[name] = data;
    if (!this._chain[name]) {
      this._chain[name] = (async () => {
        let lastErr = null;
        try {
          while (this._latest[name] !== undefined) {
            const d = this._latest[name]; delete this._latest[name];
            try { await this._write(name, d); lastErr = null; }
            catch (e) { lastErr = e; if (this._latest[name] === undefined) break; }
          }
        } finally { delete this._chain[name]; }
        if (lastErr) throw lastErr;
      })();
    }
    return this._chain[name];
  },

  async _write(name, data) {
    const body = JSON.stringify(data);
    try {
      const id = await this.getFileId(name);
      if (id) {
        const r = await this.req(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body,
        });
        if (!r.ok) throw new Error(`Save failed: ${r.status}`);
      } else {
        const bnd = 'cadencebnd';
        const meta = JSON.stringify({ name, parents: ['appDataFolder'] });
        const mp = `--${bnd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${bnd}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${bnd}--`;
        const r = await this.req(`https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id`, {
          method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${bnd}` }, body: mp,
        });
        if (!r.ok) throw new Error(`Create failed: ${r.status}`);
        const f = await r.json();
        this.fileIds[name] = f.id;
      }
      // Signal successful save
      if (this.onSaveSuccess) this.onSaveSuccess();
    } catch(e) {
      console.error('Drive save error:', e);
      if (this.onSaveError) this.onSaveError(e.message);
      throw e;
    }
  },

  // ── Fichiers binaires (photos) dans le dossier caché de l'appli ──
  async getBlob(name) {
    const id = await this.getFileId(name);
    if (!id) return null;
    const r = await this.req(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);
    if (!r.ok) throw new Error('READ_FAILED_' + r.status);
    return await r.blob();
  },
  async setBlob(name, blob) {
    const id = await this.getFileId(name);
    if (id) {
      const r = await this.req(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, {
        method: 'PATCH', headers: { 'Content-Type': blob.type || 'image/jpeg' }, body: blob,
      });
      if (!r.ok) throw new Error('Photo save failed: ' + r.status);
    } else {
      const bnd = 'cadencebnd';
      const meta = JSON.stringify({ name, parents: ['appDataFolder'] });
      const body = new Blob([
        `--${bnd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${bnd}\r\nContent-Type: ${blob.type || 'image/jpeg'}\r\n\r\n`,
        blob, `\r\n--${bnd}--`]);
      const r = await this.req(`https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id`, {
        method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${bnd}` }, body,
      });
      if (!r.ok) throw new Error('Photo create failed: ' + r.status);
      const f = await r.json();
      this.fileIds[name] = f.id;
    }
  },
  async deleteFile(name) {
    const id = await this.getFileId(name);
    if (!id) return;
    const r = await this.req(`https://www.googleapis.com/drive/v3/files/${id}`, { method: 'DELETE' });
    if (!r.ok && r.status !== 404) throw new Error('Delete failed: ' + r.status);
    delete this.fileIds[name];
  },
  async listFiles(prefix) {
    const out = []; let pageToken = '';
    do {
      const r = await this.req(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&pageSize=1000&fields=nextPageToken,files(id,name,createdTime,size)${pageToken ? '&pageToken=' + encodeURIComponent(pageToken) : ''}`);
      if (!r.ok) throw new Error('LIST_FAILED_' + r.status);
      const d = await r.json();
      (d.files || []).forEach(f => { if (f.name.startsWith(prefix)) { out.push(f); this.fileIds[f.name] = f.id; } });
      pageToken = d.nextPageToken || '';
    } while (pageToken);
    return out;
  },

  // Pending saves queue for when token expires mid-session
  pendingSaves: {},
  queueSave(name, data) {
    this.pendingSaves[name] = data;
  },
  async flushPendingSaves() {
    for (const [name, data] of Object.entries(this.pendingSaves)) {
      await this.set(name, data);
    }
    this.pendingSaves = {};
  },
};

// ─── STORAGE HOOK ─────────────────────────────────────────────────────────────
function useStorage(key, defaultVal) {
  const [val, setVal] = useState(defaultVal);
  const [loaded, setLoaded] = useState(false);
  const [loadFailed, setLoadFailed] = useState(false);
  const loadFailedRef = useRef(false);

  useEffect(() => {
    (async () => {
      try {
        let data = await DriveDB.get(key + '.json');
        if (data !== null && data !== undefined) {
          if (key === 'pm_items' && Array.isArray(data))
            data = data.map(i => {
              let item = i.category === 'technique_jazz' ? { ...i, category: 'langage_musical' } : {...i};
              // Fix: items with a parentId are variants, never groups
              if (item.parentId && item.isGroup) item.isGroup = false;
              // Fix: non-morceau items should always be active unless explicitly paused
              if (item.category !== 'morceau' && !item.isGroup && item.isActive === undefined) {
                item.isActive = true;
              }
              return item;
            });
          if (key === 'pm_sessions' && Array.isArray(data)) {
            // Migrate old category names
            data = data.map(s => ({ ...s, blocks: Array.isArray(s.blocks) ? s.blocks.map(b => b.category === 'technique_jazz' ? { ...b, category: 'langage_musical' } : b) : s.blocks }));
            // Remove sessions with invalid or missing dates
            data = data.filter(s => s.date && !isNaN(new Date(s.date + 'T12:00:00').getTime()));
          }
          if (key === 'pm_settings' && data && typeof data === 'object' && !Array.isArray(data)) data = { ...defaultVal, ...data };
          setVal(data);
        }
      } catch(e) {
        console.error('Drive read:', e);
        // Lecture impossible : on NE doit PAS écrire les valeurs par défaut sur Drive
        loadFailedRef.current = true;
        DriveDB.readFailed = true;
        setLoadFailed(true);
      }
      setLoaded(true);
    })();
  }, []);

  const save = useCallback((updater) => {
    setVal(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      if (loadFailedRef.current) return next; // lecture Drive échouée : aucune écriture
      DriveDB.set(key + '.json', next).catch(err => {
        console.error('Save error:', err);
        // Queue for retry
        DriveDB.queueSave(key + '.json', next);
      });
      return next;
    });
  }, [key]);

  return [val, save, loaded, loadFailed];
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function toDateStr(d) { return (d || new Date()).toISOString().slice(0, 10); }
function getWeekKey(date, weekStartDay = 4) {
  // Date locale (pas UTC) : une chaîne 'YYYY-MM-DD' est lue à midi pour éviter tout décalage de jour
  const d = typeof date === 'string' ? new Date(date.slice(0,10) + 'T12:00:00') : new Date(date || new Date());
  d.setHours(12,0,0,0);
  let diff = d.getDay() - weekStartDay;
  if (diff < 0) diff += 7;
  d.setDate(d.getDate() - diff);
  return localISO(d);
}
// Deux dates sont-elles dans la même semaine (selon le jour de début réglé) ? Ignore le weekKey enregistré.
function sameWeek(dateA, dateB, weekStartDay = 4) { return getWeekKey(dateA, weekStartDay) === getWeekKey(dateB, weekStartDay); }

function getWeekDays(weekStartDay = 4) {
  // Returns array of dateStr for the current week
  const start = new Date(getWeekKey(new Date(), weekStartDay) + 'T12:00:00');
  return Array.from({ length: 7 }, (_, i) => {
    const d = new Date(start); d.setDate(d.getDate() + i);
    return localISO(d);
  });
}

// Calculate catchup minutes for today based on missed days this week
function calculateCatchup(sessions, settings, dateStr) {
  const weekStartDay = settings.weekStartDay ?? 4;
  const weekKey = getWeekKey(dateStr, weekStartDay);
  const weekStart = new Date(weekKey + 'T12:00:00');

  const today = new Date(dateStr + 'T12:00:00');
  const EXEMPT_TYPES = ['off', 'alternatif'];

  // Get all past days of the week
  const pastDays = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart); d.setDate(d.getDate() + i);
    if (d < today) pastDays.push(localISO(d));
  }

  // Count catchup minutes already done in validated sessions this week
  // Use date range instead of weekKey to avoid mismatch issues
  const weekStartStr = weekKey;
  const weekEndDate = new Date(weekStart); weekEndDate.setDate(weekEndDate.getDate() + 6);
  const weekEndStr = localISO(weekEndDate);

  const alreadyCaughtUpMin = sessions
    .filter(s => s.validated && s.catchupMin > 0 && s.date >= weekStartStr && s.date <= weekEndStr && s.date < dateStr)
    .reduce((a, s) => a + (s.catchupMin || 0), 0);

  // Count missed days and partial days
  // Full miss = no session or 0 blocks done → 1/3 of total planned time as debt
  // Partial < 50% = fraction of unfinished time as debt
  // ≥ 50% done, joker, off, alternatif → no debt
  let totalDebtMin = 0;
  for (const ds of pastDays) {
    const s = sessions.find(ss => ss.date === ds);
    if (!s || s.joker || EXEMPT_TYPES.includes(s.type)) continue;

    const blocks = s.blocks || [];
    const totalBlocks = blocks.length;
    const doneBlocks = blocks.filter(b => b.validated).length;

    if (s.validated || (totalBlocks > 0 && doneBlocks / totalBlocks >= 0.5)) continue; // ≥50% done

    // Calculate planned time for undone blocks
    const undoneMin = blocks
      .filter(b => !b.validated)
      .reduce((a, b) => a + (b.plannedMin || 0), 0);

    const plannedTotal = blocks.reduce((a, b) => a + (b.plannedMin || 0), 0) || 30;
    const missedMin = totalBlocks === 0 ? plannedTotal : undoneMin;
    totalDebtMin += Math.round(missedMin / 3);
  }

  if (totalDebtMin === 0) return 0;

  // Subtract already caught up minutes
  const remainingDebt = Math.max(0, totalDebtMin - alreadyCaughtUpMin);
  if (remainingDebt === 0) return 0;

  // Remaining days in week including today
  const remainingDays = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart); d.setDate(d.getDate() + i);
    const ds = d.toISOString().slice(0, 10);
    if (ds >= dateStr) remainingDays.push(ds);
  }

  return remainingDays.length > 0 ? Math.round(remainingDebt / remainingDays.length) : 0;
}
const TODAY = toDateStr();

// Find all consecutive alternatif days connected to a given date
function getAlternatifPeriod(sessions, dateStr) {
  const altDates = new Set(sessions.filter(s => s.type === 'alternatif').map(s => s.date));
  if (!altDates.has(dateStr)) return [];

  // Walk backwards and forwards to find all connected days
  const result = [dateStr];
  const base = new Date(dateStr + 'T12:00:00');

  // Walk backwards
  for (let i = 1; i <= 30; i++) {
    const d = new Date(base); d.setDate(d.getDate() - i);
    const ds = d.toISOString().slice(0, 10);
    if (altDates.has(ds)) result.unshift(ds);
    else break;
  }

  // Walk forwards
  for (let i = 1; i <= 30; i++) {
    const d = new Date(base); d.setDate(d.getDate() + i);
    const ds = d.toISOString().slice(0, 10);
    if (altDates.has(ds)) result.push(ds);
    else break;
  }

  return result;
}

// ─── PHOTOS (un fichier par photo dans le dossier caché Drive) ────────────────
// Dans un exercice, item.images contient {id, thumb} : id = fichier Drive, thumb = miniature.
// (Les anciennes photos, stockées en texte base64 directement, restent lisibles.)
const PHOTO_PREFIX = 'cadence_img_';
const photoFileName = id => PHOTO_PREFIX + id + '.jpg';
const newPhotoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

// Copie locale (IndexedDB) : une photo déjà ouverte s'affiche instantanément, même sans réseau
const ImgCache = {
  _db: null,
  open() {
    if (!this._db) this._db = new Promise((res, rej) => {
      try {
        const r = indexedDB.open('cadence-img', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('imgs');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
    return this._db;
  },
  async get(id) {
    try {
      const db = await this.open();
      return await new Promise(res => {
        const q = db.transaction('imgs').objectStore('imgs').get(id);
        q.onsuccess = () => res(q.result || null);
        q.onerror = () => res(null);
      });
    } catch (_) { return null; }
  },
  async put(id, blob) {
    try {
      const db = await this.open();
      await new Promise(res => {
        const tx = db.transaction('imgs', 'readwrite');
        tx.objectStore('imgs').put(blob, id);
        tx.oncomplete = tx.onerror = tx.onabort = () => res();
      });
    } catch (_) {}
  },
  async del(id) {
    try {
      const db = await this.open();
      await new Promise(res => {
        const tx = db.transaction('imgs', 'readwrite');
        tx.objectStore('imgs').delete(id);
        tx.oncomplete = tx.onerror = tx.onabort = () => res();
      });
    } catch (_) {}
  },
};

async function getPhotoBlob(id) {
  const cached = await ImgCache.get(id);
  if (cached) return cached;
  const blob = await DriveDB.getBlob(photoFileName(id));
  if (blob) await ImgCache.put(id, blob);
  return blob;
}
const photoUrls = {};
async function getPhotoUrl(id) {
  if (photoUrls[id]) return photoUrls[id];
  const b = await getPhotoBlob(id);
  if (!b) return null;
  return (photoUrls[id] = URL.createObjectURL(b));
}

// Prépare une photo : grande image (2000 px max, JPEG 80 %) + miniature (300 px)
async function makePhoto(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('IMG')); i.src = url; });
    const draw = maxSide => {
      const r = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.naturalWidth * r); cv.height = Math.round(img.naturalHeight * r);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      return cv;
    };
    const blob = await new Promise((res, rej) => draw(2000).toBlob(b => b ? res(b) : rej(new Error('BLOB')), 'image/jpeg', 0.8));
    return { id: newPhotoId(), thumb: draw(300).toDataURL('image/jpeg', 0.6), blob, pending: true };
  } finally { URL.revokeObjectURL(url); }
}

// Envoie sur Drive les photos ajoutées dans le formulaire ; renvoie les références {id, thumb}
async function commitPhotos(images) {
  if (DriveDB.readFailed && images.some(im => im && im.pending)) throw new Error('LOAD_FAILED');
  const out = [];
  for (const im of images) {
    if (im && im.pending) {
      await DriveDB.setBlob(photoFileName(im.id), im.blob);
      await ImgCache.put(im.id, im.blob);
      out.push({ id: im.id, thumb: im.thumb });
    } else out.push(im);
  }
  return out;
}

function collectPhotoIds(items) {
  const ids = [];
  (items || []).forEach(i => (i.images || []).forEach(im => {
    if (im && typeof im === 'object' && im.id && !ids.includes(im.id)) ids.push(im.id);
  }));
  return ids;
}

// ─── SAUVEGARDE / IMPORT (fichier .json sans photos, .zip avec photos) ───────
function loadJSZip() {
  if (window.JSZip) return Promise.resolve(window.JSZip);
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/jszip@3.10.1/dist/jszip.min.js';
    s.onload = () => res(window.JSZip);
    s.onerror = () => rej(new Error('Impossible de charger la bibliothèque ZIP (connexion ?)'));
    document.head.appendChild(s);
  });
}

async function buildBackup(data, onProgress) {
  const payload = { app: 'cadence', version: 2, exportedAt: new Date().toISOString(), items: data.items, sessions: data.sessions, settings: data.settings };
  const ids = collectPhotoIds(data.items);
  const day = localISO(new Date());
  if (!ids.length) {
    return { blob: new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }), filename: 'cadence-sauvegarde-' + day + '.json', photos: 0, missing: 0 };
  }
  const JSZip = await loadJSZip();
  const zip = new JSZip();
  zip.file('cadence.json', JSON.stringify(payload, null, 2));
  let n = 0, missing = 0;
  for (const id of ids) {
    onProgress && onProgress('Photos ' + (++n) + '/' + ids.length + '…');
    let blob = null;
    try { blob = await getPhotoBlob(id); } catch (_) {}
    if (blob) zip.file('photos/' + id + '.jpg', blob); else missing++;
  }
  onProgress && onProgress('Création du fichier…');
  const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
  return { blob, filename: 'cadence-sauvegarde-' + day + '.zip', photos: ids.length - missing, missing };
}

async function parseBackup(file) {
  let text, zip = null;
  if (/\.json$/i.test(file.name)) text = await file.text();
  else {
    const JSZip = await loadJSZip();
    zip = await JSZip.loadAsync(file);
    const entry = zip.file('cadence.json');
    if (!entry) throw new Error('Fichier non reconnu (cadence.json introuvable).');
    text = await entry.async('string');
  }
  let data;
  try { data = JSON.parse(text); } catch (_) { throw new Error('Fichier illisible.'); }
  if (!data || !Array.isArray(data.items) || !Array.isArray(data.sessions) || !data.settings || typeof data.settings !== 'object')
    throw new Error('Fichier de sauvegarde non reconnu.');
  const photoNames = zip ? Object.keys(zip.files).filter(n => /^photos\/.+\.jpg$/i.test(n)) : [];
  return { data, zip, photoNames };
}

async function restorePhotos(zip, names, onProgress) {
  const existing = new Set((await DriveDB.listFiles(PHOTO_PREFIX)).map(f => f.name));
  let n = 0, uploaded = 0;
  for (const name of names) {
    const id = name.replace(/^photos\//, '').replace(/\.jpg$/i, '');
    onProgress && onProgress('Photos ' + (++n) + '/' + names.length + '…');
    if (existing.has(photoFileName(id))) continue;
    const bytes = await zip.file(name).async('uint8array');
    const blob = new Blob([bytes], { type: 'image/jpeg' });
    await DriveDB.setBlob(photoFileName(id), blob);
    await ImgCache.put(id, blob);
    uploaded++;
  }
  return uploaded;
}

// ─── ALGORITHM ───────────────────────────────────────────────────────────────
// Délai (en jours) avant qu'un item devienne "obligatoire" : celui de sa fréquence,
// doublé si l'item est bien maîtrisé.
function urgencyDelay(item, mdu) {
  const freq = FREQUENCY_WEIGHT[item.frequency] !== undefined ? item.frequency : 'normal';
  return (mdu || MAX_DAYS_UNSEEN)[freq] * (item.mastery === 'bonne' ? 2 : 1);
}

function pickItem(items, dateStr, maxDaysUnseen) {
  if (!items.length) return null;
  const mdu = maxDaysUnseen || MAX_DAYS_UNSEEN;
  const rand = arr => arr[Math.floor(Math.random() * arr.length)];
  const info = items.map(item => {
    const freq = FREQUENCY_WEIGHT[item.frequency] !== undefined ? item.frequency : 'normal';
    const daysSince = item.lastWorked
      ? Math.floor((new Date(dateStr) - new Date(item.lastWorked)) / 86400000) : NaN;
    const never = !item.lastWorked || isNaN(daysSince);
    const overdue = !never && daysSince >= urgencyDelay(item, mdu);
    return { item, freq, daysSince, never, overdue };
  });

  // 1) Items urgents, niveau de priorité par niveau (⭐ puis — puis 🌙) :
  //    dans un niveau, les jamais travaillés d'abord, puis ceux dont le délai est dépassé
  //    (tirage au hasard entre eux).
  for (const freq of ['priority', 'normal', 'occasional']) {
    const tier = info.filter(x => x.freq === freq);
    const never = tier.filter(x => x.never);
    if (never.length) return rand(never).item;
    const late = tier.filter(x => x.overdue);
    if (late.length) return rand(late).item;
  }

  // 2) Sinon : tirage pondéré fréquence × maîtrise × récence
  const weights = info.map(x =>
    FREQUENCY_WEIGHT[x.freq] * ((MASTERY[x.item.mastery] || MASTERY.fragile).weight) * Math.min(x.daysSince + 1, 10));
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < items.length; i++) { r -= weights[i]; if (r <= 0) return items[i]; }
  return items[items.length - 1];
}

// Dates locales (sans décalage de fuseau horaire)
function localISO(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function weekStartOf(dateStr, weekStartDay) {
  const d = new Date(dateStr + 'T12:00:00');
  d.setDate(d.getDate() - ((d.getDay() - weekStartDay + 7) % 7));
  return localISO(d);
}

// Révisions étalées sur la semaine. Seules les révisions VALIDÉES comptent comme faites :
// une révision prévue mais non faite reste due les jours suivants.
// Objectif cumulé à la fin du jour n (0 = 1er jour de la semaine) : ceil(révisions × (n+1) / 7)
function isRevisionDay(dateStr, revDays, sessions, weekStartDay = 4) {
  if (!revDays) return false;
  const ws = weekStartOf(dateStr, weekStartDay);
  const dayIdx = (new Date(dateStr + 'T12:00:00').getDay() - weekStartDay + 7) % 7;
  const expected = Math.ceil(revDays * (dayIdx + 1) / 7);
  const done = sessions.filter(s =>
    s.date && s.date !== dateStr && weekStartOf(s.date, weekStartDay) === ws &&
    Array.isArray(s.blocks) && s.blocks.some(b => b.category === 'revision' && b.validated)
  ).length;
  return done < expected;
}

// Choix du morceau à réviser (pool = morceaux hors "en cours", non en pause).
// Référence = dernière révision (à défaut dernier travail). Délai doublé si bien maîtrisé.
// 1) jamais révisé ni travaillé  2) délai dépassé (le plus en retard d'abord)
// 3) tirage pondéré par la maîtrise (🔴 3 / 🟡 2 / 🟢 1) × temps écoulé (plafonné à 30 j)
function pickRevision(pool, dateStr, delayDays) {
  if (!pool.length) return null;
  const info = pool.map(item => {
    const ref = item.lastRevised || item.lastWorked;
    const days = ref ? Math.floor((new Date(dateStr) - new Date(ref)) / 86400000) : NaN;
    const never = !ref || isNaN(days);
    const delay = delayDays * (item.mastery === 'bonne' ? 2 : 1);
    return { item, days, never, delay, overdue: !never && days >= delay };
  });
  const never = info.filter(x => x.never);
  if (never.length) return never[Math.floor(Math.random() * never.length)].item;
  const late = info.filter(x => x.overdue).sort((a, b) => (b.days / b.delay) - (a.days / a.delay));
  if (late.length) return late[0].item;
  const weights = info.map(x => ((MASTERY[x.item.mastery] || MASTERY.fragile).weight) * Math.min(x.days + 1, 30));
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < info.length; i++) { r -= weights[i]; if (r <= 0) return info[i].item; }
  return info[info.length - 1].item;
}

// Estimate total session time for validation
function estimateSessionTime(settings) {
  const days = settings.workDaysPerWeek || 6;
  const revDays = settings.revisionDaysPerWeek || 2;
  const nb = {
    gammes: settings.nbGammes || 1,
    langage: settings.nbLangage || 1,
    morceaux: settings.nbMorceaux || 1,
  };
  const timePerGamme   = settings.gammesDailyMin || 8;
  const timePerLangage = Math.round((settings.techJazzWeeklyMin || 35) / days / nb.langage);
  const timePerMorceau = Math.round((settings.morceauxWeeklyMin || 60) / days / nb.morceaux);
  const timePerRevision = Math.round((settings.revisionsWeeklyMin || 16) / revDays);

  const totalWithRev    = timePerGamme * nb.gammes
    + timePerLangage * nb.langage
    + timePerMorceau * nb.morceaux
    + timePerRevision;
  const totalWithoutRev = timePerGamme * nb.gammes
    + timePerLangage * nb.langage
    + timePerMorceau * nb.morceaux;

  return { timePerGamme, timePerLangage, timePerMorceau, timePerRevision, totalWithRev, totalWithoutRev, nb };
}

// Validate settings — returns array of error strings (empty = OK)
function validateSettings(settings) {
  const errors = [];
  const est = estimateSessionTime(settings);
  const cap = settings.sessionCapMin || 50;
  const MIN = 5;

  if (est.timePerGamme < MIN)
    errors.push(`Gammes : ${est.timePerGamme} min/item < ${MIN} min minimum`);
  if (est.timePerLangage < MIN)
    errors.push(`Langage musical : ${est.timePerLangage} min/item < ${MIN} min minimum`);
  if (est.timePerMorceau < MIN)
    errors.push(`Morceaux : ${est.timePerMorceau} min/item < ${MIN} min minimum`);
  if (est.timePerRevision < MIN)
    errors.push(`Révision : ${est.timePerRevision} min par séance (budget ÷ ${settings.revisionDaysPerWeek || 2} révisions/sem.) < ${MIN} min minimum`);
  if (est.totalWithRev > cap)
    errors.push(`Session estimée avec révision : ${est.totalWithRev} min > cap de ${cap} min`);

  return errors;
}

function generateSession(items, settings, sessions, dateStr) {
  const maxDaysUnseen = {
    priority: settings.maxDaysUnseenPriority || MAX_DAYS_UNSEEN.priority,
    normal:   settings.maxDaysUnseenNormal   || MAX_DAYS_UNSEEN.normal,
    occasional: settings.maxDaysUnseenOccasional || MAX_DAYS_UNSEEN.occasional,
  };
  const sessionCap = settings.sessionCapMin || SESSION_MAX_MIN;
  const catchupMin = calculateCatchup(sessions, settings, dateStr);
  const hasCatchup = catchupMin > 0;
  const blocks = [];
  const nbGammes   = settings.nbGammes   || 1;
  const nbLangage  = settings.nbLangage  || 1;
  const nbMorceaux = settings.nbMorceaux || 1;
  const gammeMin   = settings.gammesDailyMin;
  const langMin    = Math.round(settings.techJazzWeeklyMin / settings.workDaysPerWeek / nbLangage);
  const morceauMin = Math.round(settings.morceauxWeeklyMin / settings.workDaysPerWeek / nbMorceaux);

  const pickN = (pool, n) => {
    const picked = []; const used = new Set();
    for (let i = 0; i < n; i++) {
      const available = pool.filter(item => !used.has(item.id));
      if (!available.length) break;
      const item = pickItem(available, dateStr, maxDaysUnseen);
      if (!item) break;
      picked.push(item); used.add(item.id);
    }
    return picked;
  };

  pickN(items.filter(i => i.category === 'gammes' && i.isActive && i.isGroup !== true && !i.paused), nbGammes).forEach(item => {
    const family = item.parentId ? items.find(i => i.id === item.parentId) : null;
    blocks.push({ itemId: item.id, title: item.title, category: 'gammes', plannedMin: gammeMin, validated: false, familyName: family?.title || null });
  });

  pickN(items.filter(i => i.category === 'langage_musical' && i.isActive && i.isGroup !== true && !i.paused), nbLangage).forEach(item => {
    const family = item.parentId ? items.find(i => i.id === item.parentId) : null;
    blocks.push({ itemId: item.id, title: item.title, category: 'langage_musical', plannedMin: langMin, validated: false, familyName: family?.title || null });
  });

  pickN(items.filter(i => i.category === 'morceau' && i.isActive && i.isGroup !== true && !i.paused), nbMorceaux).forEach(item => {
    const family = item.parentId ? items.find(i => i.id === item.parentId) : null;
    blocks.push({ itemId: item.id, title: item.title, category: 'morceau', plannedMin: morceauMin, validated: false, familyName: family?.title || null });
  });

  const doRevision = isRevisionDay(dateStr, settings.revisionDaysPerWeek, sessions, settings.weekStartDay ?? 4);
  if (doRevision) {
    const rev = pickRevision(
      items.filter(i => i.category === 'morceau' && !i.isActive && i.isGroup !== true && !i.paused),
      dateStr, settings.revisionMaxDays || 21);
    if (rev) blocks.push({ itemId: rev.id, title: rev.title, category: 'revision', plannedMin: Math.round(settings.revisionsWeeklyMin / settings.revisionDaysPerWeek), validated: false });
  }

  let totalMin = blocks.reduce((a,b) => a+b.plannedMin, 0);

  // Apply session cap only when no catchup
  if (!hasCatchup && totalMin > sessionCap) {
    const excess = totalMin - sessionCap;
    const scalable = blocks.filter(b => b.category !== 'gammes');
    const scalableTotal = scalable.reduce((a,b) => a+b.plannedMin, 0);
    if (scalableTotal > 0) scalable.forEach(b => { b.plannedMin = Math.max(5, Math.round(b.plannedMin * (1 - excess / scalableTotal))); });
    totalMin = blocks.reduce((a,b) => a+b.plannedMin, 0);
  }

  // Add catchup: extra item + spread remaining time
  if (hasCatchup) {
    const usedIds = new Set(blocks.map(b => b.itemId));

    // Try 2nd morceau first, then 2nd langage musical, then 2nd gamme
    const extraCandidates = [
      ...items.filter(i => i.category==='morceau' && i.isActive && i.isGroup!==true && !i.paused && !usedIds.has(i.id)),
      ...items.filter(i => i.category==='langage_musical' && i.isActive && i.isGroup!==true && !i.paused && !usedIds.has(i.id)),
      ...items.filter(i => i.category==='gammes' && i.isActive && i.isGroup!==true && !i.paused && !usedIds.has(i.id)),
    ];
    const extraPools = [
      items.filter(i => i.category==='morceau' && i.isActive && i.isGroup!==true && !i.paused && !usedIds.has(i.id)),
      items.filter(i => i.category==='langage_musical' && i.isActive && i.isGroup!==true && !i.paused && !usedIds.has(i.id)),
      items.filter(i => i.category==='gammes' && i.isActive && i.isGroup!==true && !i.paused && !usedIds.has(i.id)),
    ];

    let extraItem = null;
    for (const pool of extraPools) {
      extraItem = pickItem(pool, dateStr, maxDaysUnseen);
      if (extraItem) break;
    }

    const catchupBlockMin = Math.round(catchupMin * 0.6);
    const catchupSpreadMin = catchupMin - catchupBlockMin;

    if (extraItem) {
      const extraFamily = extraItem.parentId ? items.find(i => i.id === extraItem.parentId) : null;
      blocks.push({
        itemId: extraItem.id, title: extraItem.title, category: extraItem.category,
        plannedMin: catchupBlockMin, validated: false,
        familyName: extraFamily ? extraFamily.title : null, isCatchup: true
      });
    }

    // Spread remaining catchup time on existing non-gammes blocks
    const spreadBlocks = blocks.filter(b => !b.isCatchup && b.category !== 'gammes');
    if (spreadBlocks.length > 0) {
      const extra = Math.round(catchupSpreadMin / spreadBlocks.length);
      spreadBlocks.forEach(b => { b.plannedMin += extra; });
    }

    totalMin = blocks.reduce((a,b) => a+b.plannedMin, 0);
  }

  const weekStartDay = settings.weekStartDay ?? 4;
  return { blocks, totalMin, weekKey: getWeekKey(dateStr, weekStartDay), hasRevision: blocks.some(b => b.category === 'revision'), catchupMin: hasCatchup ? catchupMin : 0 };
}

// ─── IMAGE GALLERY ────────────────────────────────────────────────────────────
// Image zoomable (pincement à 2 doigts, glisser, double-tap pour zoomer / revenir)
function ZoomableImage({ src }) {
  const [t, setT] = useState({ s: 1, x: 0, y: 0 });
  const pts = useRef(new Map());
  const lastTap = useRef(0);
  const down = e => { e.currentTarget.setPointerCapture(e.pointerId); pts.current.set(e.pointerId, { x: e.clientX, y: e.clientY }); };
  const move = e => {
    const prev = pts.current.get(e.pointerId);
    if (!prev) return;
    const cur = { x: e.clientX, y: e.clientY };
    if (pts.current.size === 2) {
      const [a, b] = [...pts.current.values()];
      const oldD = Math.hypot(a.x - b.x, a.y - b.y);
      pts.current.set(e.pointerId, cur);
      const [a2, b2] = [...pts.current.values()];
      const newD = Math.hypot(a2.x - b2.x, a2.y - b2.y);
      if (oldD > 0) setT(o => { const s = Math.min(6, Math.max(1, o.s * newD / oldD)); return s === 1 ? { s: 1, x: 0, y: 0 } : { ...o, s }; });
    } else {
      pts.current.set(e.pointerId, cur);
      setT(o => o.s > 1 ? { ...o, x: o.x + cur.x - prev.x, y: o.y + cur.y - prev.y } : o);
    }
  };
  const up = e => {
    const wasSingle = pts.current.size === 1;
    pts.current.delete(e.pointerId);
    if (wasSingle) {
      const now = Date.now();
      if (now - lastTap.current < 300) setT(o => o.s > 1 ? { s: 1, x: 0, y: 0 } : { s: 2.5, x: 0, y: 0 });
      lastTap.current = now;
    }
  };
  const wheel = e => setT(o => { const s = Math.min(6, Math.max(1, o.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15))); return s === 1 ? { s: 1, x: 0, y: 0 } : { ...o, s }; });
  return (
    <img src={src} alt="" draggable={false} onClick={e => e.stopPropagation()}
      onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up} onWheel={wheel}
      style={{ maxWidth: '100%', maxHeight: '82vh', objectFit: 'contain', borderRadius: 6, touchAction: 'none', userSelect: 'none',
        transform: `translate(${t.x}px, ${t.y}px) scale(${t.s})`, transition: pts.current.size ? 'none' : 'transform 0.15s' }} />
  );
}

}

// ─── SOUND ───────────────────────────────────────────────────────────────────
function playTimerEndSound(enabled) {
  if (!enabled) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    // Three ascending beeps
    [0, 0.3, 0.6].forEach((delay, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 440 + i * 110; // A4, C#5, E5
      osc.type = 'sine';
      gain.gain.setValueAtTime(0, ctx.currentTime + delay);
      gain.gain.linearRampToValueAtTime(0.4, ctx.currentTime + delay + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.4);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + 0.4);
    });
  } catch(e) { console.log('Audio not available:', e); }
}

// ─── TIMER HOOK (timestamp-based + notification) ─────────────────────────────
function useTimer(plannedMin, label, soundEnabled) {
  const totalSec = plannedMin * 60;
  const [secondsLeft, setSecondsLeft] = useState(totalSec);
  const [running, setRunning] = useState(false);
  const [finished, setFinished] = useState(false);
  const startTimeRef = useRef(null);   // timestamp when started
  const savedSecondsRef = useRef(totalSec); // seconds left when paused
  const rafRef = useRef(null);

  // Reset when plannedMin changes
  useEffect(() => {
    setRunning(false);
    setFinished(false);
    setSecondsLeft(totalSec);
    savedSecondsRef.current = totalSec;
    startTimeRef.current = null;
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
  }, [plannedMin]);

  // Tick using requestAnimationFrame + timestamps — survives screen wake
  useEffect(() => {
    if (!running) {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      return;
    }

    startTimeRef.current = Date.now();

    const tick = () => {
      const elapsed = Math.floor((Date.now() - startTimeRef.current) / 1000);
      const left = Math.max(0, savedSecondsRef.current - elapsed);
      setSecondsLeft(left);
      if (left <= 0) {
        setRunning(false);
        setFinished(true);
        cancelTimerNotification();
        playTimerEndSound(soundEnabled);
        return;
      }
      rafRef.current = requestAnimationFrame(tick);
    };
    rafRef.current = requestAnimationFrame(tick);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [running]);

  // Schedule notification when timer starts
  const scheduleTimerNotification = (secondsFromNow, timerLabel) => {
    if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) return;
    navigator.serviceWorker.controller.postMessage({
      type: 'TIMER_NOTIF',
      delayMs: secondsFromNow * 1000,
      label: timerLabel || 'Temps écoulé !',
    });
  };

  const cancelTimerNotification = () => {
    if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) return;
    navigator.serviceWorker.controller.postMessage({ type: 'TIMER_CANCEL' });
  };

  const toggle = () => {
    if (finished) return;
    if (running) {
      // Pause: save remaining seconds
      const elapsed = Math.floor((Date.now() - startTimeRef.current) / 1000);
      savedSecondsRef.current = Math.max(0, savedSecondsRef.current - elapsed);
      cancelTimerNotification();
    } else {
      // Resume: schedule notification for remaining time
      scheduleTimerNotification(savedSecondsRef.current, label);
    }
    setRunning(r => !r);
  };

  const reset = () => {
    setRunning(false);
    setFinished(false);
    setSecondsLeft(totalSec);
    savedSecondsRef.current = totalSec;
    startTimeRef.current = null;
    cancelTimerNotification();
  };

  const mm = String(Math.floor(secondsLeft / 60)).padStart(2, '0');
  const ss = String(secondsLeft % 60).padStart(2, '0');
  const pct = 1 - secondsLeft / totalSec;

  return { mm, ss, pct, running, finished, toggle, reset, secondsLeft };
}

function AlternatifView({ sessions, setSessions, settings }) {
  const todaySession = sessions.find(s => s.date === TODAY);

  // Dynamically detect the full consecutive period
  const periodDates = getAlternatifPeriod(sessions, TODAY);
  const periodDays = periodDates.length;
  const dailyMin = settings?.alternatifDailyMin || 10;
  const budget = periodDays * dailyMin;
  const periodSessions = sessions.filter(s => periodDates.includes(s.date));
  const totalSpent = periodSessions.reduce((a, s) => a + (s.timeSpent || 0), 0);
  const remaining = Math.max(0, budget - totalSpent);
  const done = totalSpent >= budget;

  const [manualMin, setManualMin] = useState('');
  const [note, setNote] = useState(todaySession?.note || '');
  const [timerSec, setTimerSec] = useState(() => Math.max(0, remaining) * 60);
  const [running, setRunning] = useState(false);
  const altStartRef = useRef(null);
  const altSavedRef = useRef(Math.max(0, remaining) * 60);
  const altRafRef = useRef(null);

  useEffect(() => {
    if (!running) { if (altRafRef.current) cancelAnimationFrame(altRafRef.current); return; }
    altStartRef.current = Date.now();
    const tick = () => {
      const elapsed = Math.floor((Date.now() - altStartRef.current) / 1000);
      const left = Math.max(0, altSavedRef.current - elapsed);
      setTimerSec(left);
      if (left <= 0) { setRunning(false); return; }
      altRafRef.current = requestAnimationFrame(tick);
    };
    altRafRef.current = requestAnimationFrame(tick);
    return () => { if (altRafRef.current) cancelAnimationFrame(altRafRef.current); };
  }, [running]);

  const mm = String(Math.floor(timerSec / 60)).padStart(2, '0');
  const ss = String(timerSec % 60).padStart(2, '0');
  const pct = Math.min(1, totalSpent / budget);

  const [timeAdded, setTimeAdded] = useState(null);
  const addTime = (min) => {
    const added = parseInt(min) || 0;
    if (!added) return;
    setSessions(prev => prev.map(s =>
      s.date === TODAY ? { ...s, timeSpent: (s.timeSpent || 0) + added, note } : s
    ));
    setManualMin('');
    setTimerSec(Math.max(0, (remaining - added) * 60));
    setTimeAdded(added);
    setTimeout(() => setTimeAdded(null), 2000);
  };

  const [noteSaved, setNoteSaved] = useState(false);
  const saveNote = () => {
    setSessions(prev => prev.map(s => s.date === TODAY ? { ...s, note } : s));
    setNoteSaved(true);
    setTimeout(() => setNoteSaved(false), 2000);
  };

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 24 }}>
        <span style={{ fontSize: 36 }}>🎒</span>
        <div>
          <div style={{ fontSize: 12, color: '#888', letterSpacing: 2, textTransform: 'uppercase' }}>Travail alternatif</div>
          <div style={{ fontSize: 18, color: '#f0e6d0', fontFamily: "'Playfair Display', serif" }}>
            {new Date(TODAY + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })}
          </div>
        </div>
      </div>

      {/* Budget progress */}
      <div style={{ background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.08)', borderRadius: 14, padding: 18, marginBottom: 20 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
          <span style={{ fontSize: 13, color: '#888' }}>Budget période</span>
          <span style={{ fontSize: 13, fontFamily: 'monospace', fontWeight: 700, color: done ? '#5cba7d' : '#c9a84c' }}>{totalSpent}/{budget} min</span>
        </div>
        <div style={{ fontSize: 11, color: '#555', marginBottom: 8 }}>
          {periodDays} jour{periodDays > 1 ? 's' : ''} consécutifs · {dailyMin} min/jour
          {periodDates[0] !== TODAY && ` · du ${new Date(periodDates[0]+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'})} au ${new Date(periodDates[periodDates.length-1]+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}`}
        </div>
        <div style={{ height: 6, background: 'rgba(255,255,255,0.07)', borderRadius: 3, overflow: 'hidden', marginBottom: 8 }}>
          <div style={{ height: '100%', width: (pct * 100) + '%', background: done ? '#5cba7d' : '#c9a84c', borderRadius: 3, transition: 'width 0.4s ease' }} />
        </div>
        {done
          ? <div style={{ fontSize: 12, color: '#5cba7d' }}>🎉 Budget atteint — beau travail !</div>
          : <div style={{ fontSize: 12, color: '#555' }}>Encore {remaining} min pour valider la période</div>
        }
        {timeAdded && (
          <div style={{ marginTop: 8, fontSize: 12, color: '#5cba7d', fontWeight: 600, transition: 'all 0.3s' }}>✓ +{timeAdded} min ajoutées !</div>
        )}
      </div>

      {/* Timer */}
      <div style={{ background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.07)', borderRadius: 14, padding: 20, marginBottom: 16 }}>
        <div style={{ fontSize: 11, color: '#888', letterSpacing: 2, textTransform: 'uppercase', marginBottom: 14 }}>Minuteur</div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
          <div style={{ fontSize: 42, fontFamily: 'monospace', fontWeight: 700, color: running ? '#f0e6d0' : '#555', letterSpacing: 2 }}>{mm}:{ss}</div>
          <div style={{ display: 'flex', gap: 10 }}>
            <button onClick={() => {
              if (running) {
                const elapsed = Math.floor((Date.now() - altStartRef.current) / 1000);
                altSavedRef.current = Math.max(0, altSavedRef.current - elapsed);
              }
              setRunning(r => !r);
            }} style={{ width: 52, height: 52, borderRadius: 14, border: 'none', background: running ? 'rgba(224,92,92,0.15)' : 'rgba(201,168,76,0.15)', color: running ? '#e05c5c' : '#c9a84c', cursor: 'pointer', fontSize: 22, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              {running ? '⏸' : '▶'}
            </button>
            <button onClick={() => { setRunning(false); setTimerSec(remaining * 60); }} style={{ width: 52, height: 52, borderRadius: 14, border: '1px solid rgba(255,255,255,0.1)', background: 'rgba(255,255,255,0.04)', color: '#555', cursor: 'pointer', fontSize: 20 }}>↺</button>
          </div>
        </div>
        <button onClick={() => { const elapsed = Math.round((remaining * 60 - timerSec) / 60); if (elapsed > 0) { addTime(elapsed); setRunning(false); } }}
          disabled={Math.round((remaining * 60 - timerSec) / 60) <= 0}
          style={{ marginTop: 14, width: '100%', padding: '10px', background: Math.round((remaining * 60 - timerSec) / 60) > 0 ? 'rgba(201,168,76,0.1)' : 'rgba(255,255,255,0.03)', border: '1px solid', borderColor: Math.round((remaining * 60 - timerSec) / 60) > 0 ? 'rgba(201,168,76,0.25)' : 'rgba(255,255,255,0.08)', borderRadius: 10, color: Math.round((remaining * 60 - timerSec) / 60) > 0 ? '#c9a84c' : '#444', fontWeight: 600, fontSize: 13, cursor: Math.round((remaining * 60 - timerSec) / 60) > 0 ? 'pointer' : 'default' }}>
          ✓ Valider le temps du minuteur ({Math.max(0, Math.round((remaining * 60 - timerSec) / 60))} min)
        </button>
      </div>

      {/* Manual entry */}
      <div style={{ background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.07)', borderRadius: 14, padding: 20, marginBottom: 16 }}>
        <div style={{ fontSize: 11, color: '#888', letterSpacing: 2, textTransform: 'uppercase', marginBottom: 14 }}>Ajouter un temps manuellement</div>
        <div style={{ display: 'flex', gap: 8 }}>
          {[10, 15, 20, 30].map(v => (
            <button key={v} onClick={() => setManualMin(String(v))} style={{ flex: 1, padding: '10px 4px', borderRadius: 10, border: '1px solid', fontSize: 13, fontFamily: 'monospace', fontWeight: 700, cursor: 'pointer', background: manualMin === String(v) ? 'rgba(201,168,76,0.2)' : 'rgba(255,255,255,0.04)', borderColor: manualMin === String(v) ? '#c9a84c' : 'rgba(255,255,255,0.1)', color: manualMin === String(v) ? '#c9a84c' : '#888' }}>{v}'</button>
          ))}
          <input type="number" min="1" max="120" value={manualMin} onChange={e => setManualMin(e.target.value)}
            style={{ width: 56, background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.12)', borderRadius: 10, padding: '8px', color: '#f0e6d0', fontSize: 14, fontFamily: 'monospace', outline: 'none', textAlign: 'center' }} />
        </div>
        <button onClick={() => addTime(manualMin)} disabled={!manualMin}
          style={{ marginTop: 12, width: '100%', padding: '11px', background: manualMin ? '#c9a84c' : 'rgba(255,255,255,0.05)', border: 'none', borderRadius: 10, color: manualMin ? '#1a1a18' : '#555', fontWeight: 700, fontSize: 14, cursor: manualMin ? 'pointer' : 'default' }}>
          + Ajouter {manualMin ? manualMin + ' min' : ''}
        </button>
      </div>

      {/* Note */}
      <div style={{ background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.07)', borderRadius: 14, padding: 20 }}>
        <div style={{ fontSize: 11, color: '#888', letterSpacing: 2, textTransform: 'uppercase', marginBottom: 10 }}>Ce que tu as fait</div>
        <textarea value={note} onChange={e => setNote(e.target.value)} placeholder="Synthé, lecture, théorie, écoute active..." rows={3}
          style={{ width: '100%', background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: 10, padding: '10px 12px', color: '#c8bfa8', fontSize: 13, outline: 'none', resize: 'vertical', fontFamily: 'inherit', lineHeight: 1.6 }} />
        <button onClick={saveNote} style={{ marginTop: 10, padding: '8px 16px', background: noteSaved ? 'rgba(92,186,125,0.15)' : 'rgba(255,255,255,0.06)', border: '1px solid', borderColor: noteSaved ? 'rgba(92,186,125,0.4)' : 'rgba(255,255,255,0.12)', borderRadius: 8, color: noteSaved ? '#5cba7d' : '#888', cursor: 'pointer', fontSize: 12, transition: 'all 0.3s' }}>
          {noteSaved ? '✓ Note enregistrée !' : 'Enregistrer la note'}
        </button>
      </div>
    </div>
  );
}

  const [mastery, setMastery] = useState('fragile');

  const availableItems = items.filter(i => i.category === category && i.isGroup !== true && !i.paused);

  const handleAdd = () => {
    const item = items.find(i => i.id === selectedId);
    if (!item) return;
    onAdd({
      itemId: item.id,
      title: item.title,
      category: item.category,
      familyName: item.parentId ? (items.find(p => p.id === item.parentId)?.title || null) : null,
      actualMin: parseInt(timeMin) || 10,
      mastery,
      extra: true,
    });
    setSelectedId('');
    setTimeMin('10');

      </button>
    </div>
  );
}

// ─── TODAY VIEW ───────────────────────────────────────────────────────────────
function TodayView({ items, settings, sessions, setSessions, setItems }) {
  const existing = sessions.find(s => s.date === TODAY);
  const [session, setSession] = useState(existing || null);
  const [generated, setGenerated] = useState(!!existing);
  const [showExtra, setShowExtra] = useState(false);

  // Sync session → sessions/Drive whenever session changes
  useEffect(() => {
    if (session && session.date === TODAY) {
      setSessions(p => [...p.filter(s => s.date !== TODAY), session]);
    }
  }, [session]);
  const thisWeek = getWeekKey(new Date(), settings?.weekStartDay ?? 4);
  const jokerUsed = sessions.some(s => s.joker && s.date !== TODAY && sameWeek(s.date, TODAY, settings?.weekStartDay ?? 4));
  const isJoker = !!(session?.joker || existing?.joker);
  const isOff = existing?.type === 'off';
  const isAlternatif = existing?.type === 'alternatif';

  if (isOff) return <OffTotalView />;
  if (isAlternatif) return <AlternatifView sessions={sessions} setSessions={setSessions} settings={settings} />;

  useEffect(() => {
    if (!generated && items.length > 0) {
      const s = generateSession(items, settings, sessions, TODAY);
      setSession({ ...s, date: TODAY, validated: false });
      setGenerated(true);
    }
  }, [items, settings, sessions, generated]);

  const handleJoker = () => {
    const j = { date: TODAY, weekKey: thisWeek, joker: true, validated: false };
    setSession(j);
  };

  const handleBlockValidate = (itemId, actualMin, newMastery, cancel) => {
    setSession(prev => {
      if (!prev) return prev;
      const blocks = prev.blocks.map(b => {
        if (b.itemId !== itemId) return b;
        if (cancel) return { ...b, validated: false, actualMin: null, validatedMastery: null };
        return { ...b, validated: true, actualMin, validatedMastery: newMastery };
      });
      const allDone = blocks.every(b => b.validated);
      const totalActual = blocks.reduce((a,b) => a+(b.actualMin||0), 0);
      if (!cancel) {
        setItems(p => p.map(item => {
          if (item.id !== itemId) return item;
          const block = blocks.find(b => b.itemId === itemId);
          return { ...item, mastery: newMastery||item.mastery, lastWorked: TODAY, lastRevised: block?.category==='revision'?TODAY:item.lastRevised };
        }));
      }
      return { ...prev, blocks, validated: allDone, actualMin: totalActual };
    });
  };

  const handleRegenerate = () => {
    if (!session) return;
    // Keep validated blocks, regenerate only non-validated ones
    const validatedBlocks = session.blocks.filter(b => b.validated);
    const usedIds = new Set(validatedBlocks.map(b => b.itemId));

    // Generate a fresh session
    const fresh = generateSession(items, settings, sessions, TODAY);

    // Filter out already-validated items and already-used items from new blocks
    const newBlocks = fresh.blocks.filter(b => !usedIds.has(b.itemId));

    // Merge: keep validated + add new non-duplicate blocks
    const merged = [...validatedBlocks, ...newBlocks];
    const totalMin = merged.reduce((a, b) => a + b.plannedMin, 0);

    setSession(prev => ({
      ...prev,
      blocks: merged,
      totalMin,
      validated: false,
      actualMin: validatedBlocks.reduce((a, b) => a + (b.actualMin || 0), 0),
    }));
  };

  const handleAddExtra = (extra) => {
    setItems(p => p.map(i => i.id === extra.itemId ? { ...i, lastWorked: TODAY, mastery: extra.mastery } : i));
    setSession(prev => {
      if (!prev) return prev;
      const extraBlock = { ...extra, plannedMin: extra.actualMin, validated: true, validatedMastery: extra.mastery };
      return { ...prev, blocks: [...prev.blocks, extraBlock] };
    });
  };

  const totalPlanned = session?.blocks?.reduce((a,b) => a+b.plannedMin, 0) ?? 0;
  const doneCount = session?.blocks?.filter(b => b.validated).length ?? 0;
  const totalCount = session?.blocks?.length ?? 0;
  const allDone = doneCount > 0 && doneCount === totalCount;

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 20 }}>
        <div>
          <div style={{ fontSize: 12, color: '#888', letterSpacing: 2, textTransform: 'uppercase' }}>Aujourd'hui</div>
          <div style={{ fontSize: 20, color: '#f0e6d0', fontFamily: "'Playfair Display', serif" }}>
            {new Date(TODAY+'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })}
          </div>
        </div>
        {!isJoker && (
          <div style={{ textAlign: 'center', background: 'rgba(201,168,76,0.1)', border: '1px solid rgba(201,168,76,0.3)', borderRadius: 12, padding: '8px 16px' }}>
            <div style={{ fontSize: 22, fontWeight: 700, color: '#c9a84c', fontFamily: 'monospace' }}>{totalPlanned}'</div>
            <div style={{ fontSize: 10, color: '#888', letterSpacing: 1 }}>PLANIFIÉ</div>
          </div>
        )}
      </div>

      {/* Catchup banner */}
      {!isJoker && session?.catchupMin > 0 && (
        <div style={{ background: 'rgba(123,156,223,0.08)', border: '1px solid rgba(123,156,223,0.2)', borderRadius: 12, padding: '12px 16px', marginBottom: 16, display: 'flex', alignItems: 'center', gap: 12 }}>
          <span style={{ fontSize: 22 }}>🔄</span>
          <div>
            <div style={{ color: '#7b9cdf', fontWeight: 700, fontSize: 14 }}>Session de rattrapage</div>
            <div style={{ color: '#888', fontSize: 12, marginTop: 2 }}>+{session.catchupMin} min · un exercice supplémentaire a été ajouté</div>
          </div>
        </div>
      )}

      {!isJoker && totalCount > 0 && (
        <div style={{ marginBottom: 20 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
            <span style={{ fontSize: 12, color: '#888' }}>Progression</span>
            <span style={{ fontSize: 12, color: allDone?'#5cba7d':'#c9a84c', fontFamily: 'monospace', fontWeight: 700 }}>{doneCount}/{totalCount}</span>
          </div>
          <div style={{ height: 4, background: 'rgba(255,255,255,0.07)', borderRadius: 4, overflow: 'hidden' }}>
            <div style={{ height: '100%', borderRadius: 4, width: (doneCount/totalCount*100)+'%', background: allDone?'#5cba7d':'#c9a84c', transition: 'width 0.4s ease' }} />
          </div>
        </div>
      )}

      {isJoker && (
        <div style={{ background: 'rgba(201,168,76,0.08)', border: '1px solid rgba(201,168,76,0.25)', borderRadius: 14, padding: '18px', marginBottom: 20, display: 'flex', alignItems: 'center', gap: 14 }}>
          <span style={{ fontSize: 32 }}>🃏</span>
          <div>
            <div style={{ color: '#c9a84c', fontWeight: 700, fontSize: 16 }}>Jour joker — repos mérité</div>
            <div style={{ color: '#888', fontSize: 13, marginTop: 3 }}>Pas de session aujourd'hui. À demain !</div>
          </div>
        </div>
      )}

      {allDone && (
        <div style={{ background: 'rgba(92,186,125,0.1)', border: '1px solid rgba(92,186,125,0.3)', borderRadius: 14, padding: '16px 18px', marginBottom: 20, display: 'flex', alignItems: 'center', gap: 12 }}>
          <span style={{ fontSize: 28 }}>🎉</span>
          <div>
            <div style={{ color: '#5cba7d', fontWeight: 700, fontSize: 15 }}>Session complète !</div>
            <div style={{ color: '#888', fontSize: 13, marginTop: 2 }}>{session.blocks.reduce((a,b)=>a+(b.actualMin||0),0)} min · {doneCount} blocs</div>
          </div>
        </div>
      )}

      {!isJoker && session?.blocks?.map((block, i) => (
        <BlockCard key={i} block={block} items={items} onValidate={handleBlockValidate} soundEnabled={settings?.timerSoundEnabled !== false} />
      ))}

      {!isJoker && session && !allDone && (
        <div style={{ marginTop: 20, paddingTop: 16, borderTop: '1px solid rgba(255,255,255,0.06)' }}>
          {jokerUsed
            ? <div style={{ textAlign: 'center', fontSize: 12, color: '#555' }}>🃏 Joker déjà utilisé cette semaine</div>
            : <button onClick={handleJoker} style={{ width: '100%', padding: '12px', background: 'transparent', border: '1px solid rgba(201,168,76,0.2)', borderRadius: 12, color: '#888', fontWeight: 600, fontSize: 14, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8 }}>
                <span>🃏</span> Joker
              </button>
          }
        </div>
      )}

      {/* Extra exercises added freely */}
      {session && (() => {
        const extraBlocks = (session.blocks || []).filter(b => b.extra);
        if (!extraBlocks.length) return null;
        return (
          <div style={{ marginTop: 8, paddingTop: 12, borderTop: '1px solid rgba(255,255,255,0.06)' }}>
            <div style={{ fontSize: 11, color: '#888', letterSpacing: 1, textTransform: 'uppercase', marginBottom: 8 }}>Exercices libres</div>
            {extraBlocks.map((block, i) => {
              const cat = CATEGORIES[block.category] || CATEGORIES.gammes;
              return (
                <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '9px 12px', background: 'rgba(201,168,76,0.05)', borderLeft: '3px solid rgba(201,168,76,0.3)', borderRadius: 8, marginBottom: 6 }}>
                  <span style={{ fontSize: 18 }}>{cat.icon}</span>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 11, color: '#c9a84c', fontWeight: 700, letterSpacing: 1, textTransform: 'uppercase' }}>{cat.label}{block.familyName ? ` · ${block.familyName}` : ''}</div>
                    <div style={{ fontSize: 13, color: '#f0e6d0' }}>{block.title}</div>
                    {block.mastery && <div style={{ fontSize: 11, color: (MASTERY[block.mastery]||MASTERY.fragile).color, marginTop: 1 }}>{(MASTERY[block.mastery]||MASTERY.fragile).label}</div>}
                  </div>
                  <div style={{ fontSize: 13, color: '#c9a84c', fontFamily: 'monospace', fontWeight: 700 }}>{block.actualMin}'</div>
                </div>
              );
            })}
          </div>
        );
      })()}

      {/* Regenerate + Add extra */}
      {session && !isJoker && (
        <div style={{ marginTop: 20, paddingTop: 16, borderTop: '1px solid rgba(255,255,255,0.06)', display: 'flex', flexDirection: 'column', gap: 8 }}>
          <button onClick={handleRegenerate}
            style={{ width: '100%', padding: '11px', background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.15)', borderRadius: 10, color: '#aaa', fontSize: 13, fontWeight: 600, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8 }}>
            <span>🔄</span> Regénérer la session
          </button>
          <div>
            {!showExtra ? (
              <button onClick={() => setShowExtra(true)} style={{ width: '100%', padding: '10px', background: 'transparent', border: '1px dashed rgba(201,168,76,0.3)', borderRadius: 10, color: '#c9a84c', fontSize: 13, fontWeight: 600, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8 }}>
                <span style={{ fontSize: 16 }}>+</span> Ajouter un exercice libre
              </button>
            ) : (
              <ExtraExercisePanel items={items} onAdd={handleAddExtra} onClose={() => setShowExtra(false)} />
            )}
          </div>
        </div>
      )}

      {!session && (
        <div style={{ textAlign: 'center', padding: 40, color: '#555' }}>
          <div style={{ fontSize: 36, marginBottom: 10 }}>🎵</div>
          <div>Ajoute des exercices dans la Bibliothèque.</div>
        </div>
      )}
    </div>
  );
}

// ─── ITEM FORM ────────────────────────────────────────────────────────────────
function ItemForm({ initial, onSave, onCancel }) {
  const [form, setForm] = useState(initial || { title: '', category: 'morceau', isActive: true, frequency: 'normal', mastery: 'non_maitrise', notes: '', images: [] });
  const set = (k,v) => setForm(f => ({ ...f, [k]: v }));
  const [saving, setSaving] = useState(false);
  const [busyPhotos, setBusyPhotos] = useState(false);
  const [err, setErr] = useState('');

  const addPhotos = async e => {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    if (!files.length) return;
    setBusyPhotos(true); setErr('');
    try {
      const out = [];
      for (const f of files) out.push(await makePhoto(f));
      setForm(fm => ({ ...fm, images: [...(fm.images || []), ...out] }));
    } catch (_) { setErr("Impossible de préparer une des photos."); }
    setBusyPhotos(false);
  };

  const handleSave = async () => {
    setSaving(true); setErr('');
    try {
      const images = await commitPhotos(form.images || []);
      onSave({ ...form, images, frequency: form.frequency || 'normal' });
    } catch (e) {
      setErr(e.message === 'LOAD_FAILED' ? "Lecture Drive impossible : recharge l'appli avant d'ajouter des photos." : "L'envoi des photos a échoué (connexion ?). Réessaie.");
      setSaving(false);
    }
  };

  return (
    <div style={{ background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: 14, padding: 18, marginBottom: 12 }}>
      <input value={form.title} onChange={e => set('title', e.target.value)} placeholder="Titre..."
        style={{ width: '100%', background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.12)', borderRadius: 10, padding: '12px 14px', color: '#f0e6d0', fontSize: 15, outline: 'none', marginBottom: 12 }} />

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginBottom: 12 }}>
        <div>
          <label style={{ fontSize: 11, color: '#888', display: 'block', marginBottom: 4 }}>CATÉGORIE</label>
          <select value={form.category} onChange={e => set('category', e.target.value)} style={{ width: '100%', background: '#2a2a28', border: '1px solid rgba(255,255,255,0.12)', borderRadius: 10, padding: '10px 12px', color: '#f0e6d0', fontSize: 13, outline: 'none' }}>
            {Object.entries(CATEGORIES).map(([k,v]) => <option key={k} value={k}>{v.icon} {v.label}</option>)}
          </select>
        </div>
        <div>
          <label style={{ fontSize: 11, color: '#888', display: 'block', marginBottom: 4 }}>MAÎTRISE</label>
          <select value={form.mastery} onChange={e => set('mastery', e.target.value)} style={{ width: '100%', background: '#2a2a28', border: '1px solid rgba(255,255,255,0.12)', borderRadius: 10, padding: '10px 12px', color: '#f0e6d0', fontSize: 13, outline: 'none' }}>
            {Object.entries(MASTERY).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}
          </select>
        </div>
      </div>

      <div style={{ marginBottom: 14 }}>
        <label style={{ fontSize: 11, color: '#888', display: 'block', marginBottom: 8 }}>FRÉQUENCE D'APPARITION</label>
        <div style={{ display: 'flex', gap: 8 }}>
          {[{key:'priority',label:'Prioritaire',icon:'⭐',color:'#c9a84c'},{key:'normal',label:'Normal',icon:'—',color:'#888'},{key:'occasional',label:'Occasionnel',icon:'🌙',color:'#7b9cdf'}].map(f => (
            <button key={f.key} type="button" onClick={() => set('frequency', f.key)} style={{ flex:1, padding:'10px 4px', borderRadius:12, border:'1px solid', fontSize:11, fontWeight:700, cursor:'pointer', textAlign:'center', background:form.frequency===f.key?f.color+'25':'rgba(255,255,255,0.03)', borderColor:form.frequency===f.key?f.color:'rgba(255,255,255,0.08)', color:form.frequency===f.key?f.color:'#555' }}>
              <div style={{ fontSize:16, marginBottom:2 }}>{f.icon}</div>{f.label}
            </button>
          ))}
        </div>
      </div>

      {form.category === 'morceau' && (
        <div style={{ marginBottom: 14 }}>
          <label style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer', color: '#5cba7d', fontSize: 13 }}>
            <input type="checkbox" checked={form.isActive} onChange={e => set('isActive', e.target.checked)} style={{ accentColor: '#5cba7d', width: 16, height: 16 }} />
            Morceau en cours
          </label>
        </div>
      )}

      <div style={{ marginBottom: 12 }}>
        <label style={{ fontSize: 11, color: '#888', display: 'block', marginBottom: 6 }}>NOTES & RÉFLEXIONS</label>
        <textarea value={form.notes||''} onChange={e => set('notes', e.target.value)} placeholder="Gammes utilisées, conseils du prof..." rows={3}
          style={{ width: '100%', background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: 10, padding: '10px 12px', color: '#c8bfa8', fontSize: 13, outline: 'none', resize: 'vertical', fontFamily: 'inherit', lineHeight: 1.6 }} />
      </div>

      <div style={{ marginBottom: 16 }}>
        <label style={{ fontSize: 11, color: '#888', display: 'block', marginBottom: 8 }}>PHOTOS & PARTITIONS</label>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
          {(form.images||[]).map((src,idx) => (
            <div key={idx} style={{ position: 'relative', width: 80, height: 80 }}>
              <img src={(src && src.thumb) || src} alt="" style={{ width: 80, height: 80, objectFit: 'cover', borderRadius: 8, opacity: src && src.pending ? 0.75 : 1 }} />
              <button onClick={() => set('images', (form.images||[]).filter((_,i)=>i!==idx))} style={{ position: 'absolute', top: -6, right: -6, width: 22, height: 22, borderRadius: '50%', background: '#e05c5c', border: 'none', color: '#fff', fontSize: 14, cursor: 'pointer', fontWeight: 700 }}>×</button>
            </div>
          ))}
          <label style={{ width: 80, height: 80, borderRadius: 10, border: '2px dashed rgba(255,255,255,0.15)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', color: '#555', gap: 4 }}>
            <span style={{ fontSize: 24 }}>{busyPhotos ? '⏳' : '📷'}</span>
            <span style={{ fontSize: 10 }}>{busyPhotos ? 'Préparation' : 'Ajouter'}</span>
            <input type="file" accept="image/*" multiple style={{ display: 'none' }} disabled={busyPhotos || saving} onChange={addPhotos} />
          </label>
        </div>
      </div>

      {err && <div style={{ fontSize: 12, color: '#e05c5c', marginBottom: 10 }}>⚠️ {err}</div>}
      <div style={{ display: 'flex', gap: 10 }}>
        <button onClick={handleSave} disabled={!form.title.trim() || saving || busyPhotos}
          style={{ flex: 1, padding: '12px', background: form.title.trim() && !saving && !busyPhotos?'#c9a84c':'rgba(255,255,255,0.06)', border: 'none', borderRadius: 12, color: form.title.trim() && !saving && !busyPhotos?'#1a1a18':'#555', fontWeight: 700, fontSize: 15, cursor: form.title.trim() && !saving && !busyPhotos?'pointer':'default' }}>
          {saving ? 'Envoi des photos…' : initial ? 'Enregistrer' : 'Ajouter'}
        </button>
        <button onClick={onCancel} style={{ padding: '12px 20px', background: 'transparent', border: '1px solid rgba(255,255,255,0.12)', borderRadius: 12, color: '#888', cursor: 'pointer', fontSize: 15 }}>Annuler</button>
      </div>
    </div>
  );
}

function GroupForm({ onSave, onCancel }) {

        style={{ width: '100%', background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.12)', borderRadius: 10, padding: '11px 14px', color: '#f0e6d0', fontSize: 15, outline: 'none', marginBottom: 10, boxSizing: 'border-box' }} />
      <div style={{ marginBottom: 12 }}>
        <label style={{ fontSize: 11, color: '#888', display: 'block', marginBottom: 4 }}>CATÉGORIE</label>
        <select value={category} onChange={e => setCategory(e.target.value)}
          style={{ width: '100%', background: '#2a2a28', border: '1px solid rgba(255,255,255,0.12)', borderRadius: 10, padding: '10px 12px', color: '#f0e6d0', fontSize: 13, outline: 'none' }}>
          {Object.entries(CATEGORIES).map(([k,v]) => <option key={k} value={k}>{v.icon} {v.label}</option>)}
        </select>
      </div>
      <div style={{ display: 'flex', gap: 10 }}>
        <button onClick={() => title.trim() && onSave(title.trim(), category)} disabled={!title.trim()}
          style={{ flex: 1, padding: '11px', background: title.trim() ? '#c9a84c' : 'rgba(255,255,255,0.06)', border: 'none', borderRadius: 10, color: title.trim() ? '#1a1a18' : '#555', fontWeight: 700, fontSize: 14, cursor: title.trim() ? 'pointer' : 'default' }}>
          Créer le groupe
        </button>
        <button onClick={onCancel} style={{ padding: '11px 18px', background: 'transparent', border: '1px solid rgba(255,255,255,0.12)', borderRadius: 10, color: '#888', cursor: 'pointer' }}>Annuler</button>
      </div>
    </div>
  );
}

// ─── LIBRARY VIEW ─────────────────────────────────────────────────────────────
function LibraryView({ items, setItems, settings }) {
  const [adding, setAdding] = useState(false);
  const [addingType, setAddingType] = useState(null); // 'item' | 'group'
  const [addingVariantTo, setAddingVariantTo] = useState(null); // parentId
  const [editing, setEditing] = useState(null);
  const [filter, setFilter] = useState('all');
  const [expandedNotes, setExpandedNotes] = useState({});
  const [expandedFamilies, setExpandedFamilies] = useState({});
  const toggleFamily = id => setExpandedFamilies(p => ({ ...p, [id]: !p[id] }));

  const match = i => filter==='all'||( filter==='active'&&i.isActive)||(filter==='priority'&&i.frequency==='priority')||(filter==='occasional'&&i.frequency==='occasional')||(filter==='paused'&&i.paused);

  const addItem = (form, parentId = null) => {
    const n = { ...form, id: Date.now().toString(), lastWorked: null, lastRevised: null };
    if (parentId) { n.parentId = parentId; n.isGroup = false; }
    // Non-morceau items are always active; morceau variants inherit parent's isActive
    if (form.category !== 'morceau') {
      n.isActive = true;
    } else if (parentId) {
      const parent = items.find(i => i.id === parentId);
      n.isActive = parent ? !!parent.isActive : true;
    }
    setItems(p => [...p, n]);
    setAdding(false);
    setAddingVariantTo(null);
  };
  const updateItem = form => { setItems(p=>p.map(i=>i.id===editing.id?{...i,...form}:i)); setEditing(null); };
  const deleteItem = id => setItems(p=>p.filter(i=>i.id!==id));
  const cycleFreq = id => { const c={normal:'priority',priority:'occasional',occasional:'normal'}; setItems(p=>p.map(i=>i.id===id?{...i,frequency:c[i.frequency||'normal']}:i)); };
  const toggleActive = id => setItems(p=>p.map(i=>i.id===id?{...i,isActive:!i.isActive}:i));
  const togglePause = (id) => setItems(p => p.map(i => i.id === id ? { ...i, paused: !i.paused } : i));

  return (
    <div>
      <div style={{ display: 'flex', gap: 8, marginBottom: 20, flexWrap: 'wrap' }}>
        {[{key:'all',label:'Tout'},{key:'active',label:'En cours'},{key:'priority',label:'⭐ Prioritaires'},{key:'occasional',label:'🌙 Occasionnels'},{key:'paused',label:'⏸ En pause'}].map(f => (
          <button key={f.key} onClick={() => setFilter(f.key)} style={{ padding: '6px 14px', borderRadius: 20, border: '1px solid', fontSize: 12, fontWeight: 600, cursor: 'pointer', background: filter===f.key?'#c9a84c':'transparent', color: filter===f.key?'#1a1a18':'#888', borderColor: filter===f.key?'#c9a84c':'rgba(255,255,255,0.12)' }}>{f.label}</button>
        ))}
        <div style={{ marginLeft: 'auto', display: 'flex', gap: 8 }}>
          <button onClick={() => { setAddingType('group'); setAdding(false); }} style={{ padding: '6px 12px', borderRadius: 20, background: 'transparent', border: '1px solid rgba(201,168,76,0.3)', color: '#c9a84c', fontWeight: 600, fontSize: 12, cursor: 'pointer' }}>📁 Groupe</button>
          <button onClick={() => { setAdding(true); setAddingType(null); }} style={{ padding: '6px 16px', borderRadius: 20, background: '#c9a84c', border: 'none', color: '#1a1a18', fontWeight: 700, fontSize: 12, cursor: 'pointer' }}>+ Ajouter</button>
        </div>
      </div>

      {/* Add item form */}
      {adding && (
        <ItemForm
          onSave={f => { const n = {...f, id: Date.now().toString(), lastWorked: null, lastRevised: null}; if(f.category!=='morceau') n.isActive=true; setItems(p=>[...p,n]); setAdding(false); }}
          onCancel={() => setAdding(false)}
        />
      )}

      {/* Add group form - just a name + category */}
      {addingType === 'group' && (
        <GroupForm
          onSave={(title, category) => {
            const n = { id: Date.now().toString(), title, category, isGroup: true, isActive: true };
            setItems(p => [...p, n]);
            setAddingType(null);
          }}
          onCancel={() => setAddingType(null)}
        />

              <span style={{ fontSize: 12, color: '#555' }}>({catItems.length})</span>
            </div>
            {/* Separate families and standalone items */}

                            return <div style={{ fontSize: 11, color, marginTop: 5 }}>{overdue?'⚠️ ':''}Vu : {label}{overdue?' — relance auto':''}</div>;

                      {expandedFamilies[family.id] && (

                      )}
